l_english:
 ctc_china_april.2.t:0 "Mourning on Campus"
 ctc_china_april.2.desc:0 "Memorial couplets and large-character posters appear outside dormitories. Some recall Hu Yaobang; others raise prices, official conduct and political reform. More sheets go up, drawing readers and people copying the words.\n\nThe schools ask their superiors whether these discussions may continue and where the collected opinions should go."
 ctc_china_april.2.a:0 "Allow discussion and let schools compile the views."
 ctc_china_april.2.b:0 "Limit activity to mourning; remove political posters."
 ctc_china_april.4.t:0 "Reassessing Hu Yaobang"
 ctc_china_april.4.desc:0 "Petitioners ask for a reassessment of Hu Yaobang, especially the criticism surrounding his resignation in 1987. Praise in the obituary does not answer this question.\n\nA review would require the organization departments to retrieve records and hear those involved. If the existing conclusion stands, that decision must also be clearly conveyed to the petitioners."
 ctc_china_april.4.a:0 "Begin a review and publish submission procedures."
 ctc_china_april.4.a_note:0 "Records a review commitment; an initial reply and implementation will still be required in May."
 ctc_china_april.4.b:0 "Retain the current assessment without reconsideration."
 ctc_china_april.5.t:0 "Appeals in Old Cases"
 ctc_china_april.5.desc:0 "Calls to reassess Hu Yaobang bring old cases onto the desk. Appellants seek review of punishments from earlier political campaigns: some concern jobs, others an education lost years ago.\n\nAccepting appeals requires staff to examine files, ask questions and answer each case. Merely receiving a stack of papers does not revoke a punishment."
 ctc_china_april.5.a:0 "Open appeals and review each case."
 ctc_china_april.5.b:0 "Do not reopen cases already decided."
 ctc_china_april.6.t:0 "Officials' Accounts"
 ctc_china_april.6.desc:0 "The petition calls for disclosure of officials' and relatives' incomes and assets. Rumors of trading permits, business dealings and diverted goods have spread. What an internal inquiry finds and what the public can see are different matters.\n\nDepartments submit two approaches: a public disclosure pilot, or continued internal review."
 ctc_china_april.6.a:0 "Propose a public disclosure pilot."
 ctc_china_april.6.a_note:0 "Public disclosure enters the oversight agenda of a future reform agreement."
 ctc_china_april.6.b:0 "Conduct an internal investigation."
 ctc_china_april.6.c:0 "Delay the decision and verify workable procedures."
 ctc_china_april.7.t:0 "Who May Publish a Newspaper?"
 ctc_china_april.7.desc:0 "Submissions call for lifting press restrictions, allowing independent newspapers and adopting a press law. Editors want authority to judge the news; supervisors fear the existing approval system being bypassed.\n\nCurrent reporting can be relaxed, while publishing rules can be debated separately. The two responses give journalists and editors different room to act."
 ctc_china_april.7.a:0 "Begin public discussion of the press system."
 ctc_china_april.7.b:0 "Broaden reporting by existing media first."
 ctc_china_april.7.c:0 "Retain the existing approval system."
 ctc_china_april.8.t:0 "Classrooms and Payslips"
 ctc_china_april.8.desc:0 "Better education conditions and treatment of intellectuals are also petition demands. Schools list difficulties with equipment, dormitories and teachers' wages. The education departments need an actionable reply.\n\nExtra earmarked spending requires changes to existing plans. Deferral to next year requires a review date; a promise cannot be counted as funds already delivered."
 ctc_china_april.8.a:0 "Adjust current plans and deliver earmarked funds."
 ctc_china_april.8.a_note:0 "Records funding delivered this year; next year's budget review does not count as current implementation."
 ctc_china_april.8.b:0 "Put it before next year's budget review."
 ctc_china_april.8.b_note:0 "Records only a review arrangement, not completed funding this year."
 ctc_china_april.8.c:0 "Make no new spending commitment."
 ctc_china_april.9.t:0 "Rules for Assembly"
 ctc_china_april.9.desc:0 "March applications, routes and liaison arrangements pass between schools and public security departments. Students want public expression; personnel on duty want to know who will take responsibility.\n\nWhether the parties can agree temporary rules or continue under existing regulations must be clarified before crowds next enter the streets."
 ctc_china_april.9.a:0 "Negotiate temporary rules and review existing regulations."
 ctc_china_april.9.b:0 "Retain existing regulations."
 ctc_china_april.10.t:0 "Reporting Today's Events"
 ctc_china_april.10.desc:0 "Debate over the press system continues, but today's newspaper must go to print. Reporters have visited campuses and streets, recording demands and departmental replies.\n\nEditors need clear instructions: may verified accounts be published, or must they use only centrally approved bulletins?"
 ctc_china_april.10.a:0 "Publish verified demands and responses from all sides."
 ctc_china_april.10.b:0 "Use only approved bulletins."
 ctc_china_april.11.t:0 "Before Xinhua Gate"
 ctc_china_april.11.desc:0 "Petitioners gather outside Xinhua Gate seeking a meeting with a leader. Guards hold the entrance while more people approach. Reports from the scene press the leadership for instructions.\n\nAn empowered representative, a desk that merely forwards papers, or an order to disperse will each send the night in a different direction."
 ctc_china_april.11.a:0 "Send authorized representatives to receive the petition."
 ctc_china_april.11.b:0 "Keep a reception desk and continue urging dispersal."
 ctc_china_april.11.b_note:0 "Allegations of clashes may still arise; injuries and the handling of events must be checked."
 ctc_china_april.11.c:0 "Order the gathering ended and the crowd dispersed."
 ctc_china_april.12.t:0 "Reports of Injuries"
 ctc_china_april.12.desc:0 "The response outside Xinhua Gate is disputed. Students submit accounts of injuries and events; the personnel on duty submit their own report. Some campus reports can be checked, while others remain secondhand.\n\nScene records and hospital documents should be obtained before an explanation is issued. The investigation's scope and openness will also determine whether its conclusions are believed."
 ctc_china_april.12.a:0 "Verify the evidence and publish the inquiry procedure."
 ctc_china_april.12.b:0 "Conduct an internal inquiry only."
 ctc_china_april.12.c:0 "Retain the existing bulletin without a new inquiry."
 ctc_china_april.13.t:0 "Empty Classrooms"
 ctc_china_april.13.desc:0 "Some classrooms stand empty as students debate continuing the class boycott and organizing mourning and petitions. Teachers begin carrying views between students and administrators.\n\nClasses and exams need arranging, while canteens, dormitories and campus hospitals must keep working. Schools ask whether negotiations or discipline should bring students back."
 ctc_china_april.13.a:0 "Let schools negotiate returns and make-up classes."
 ctc_china_april.13.b:0 "Use disciplinary measures to end the boycott."
 ctc_china_april.13.c:0 "Maintain campus services and delay action."
 ctc_china_april.14.t:0 "An Open Letter from Intellectuals"
 ctc_china_april.14.desc:0 "Scholars and writers sign letters urging a serious response to students and an end to escalating confrontation. Their views differ, but all seek a voice between government and campus.\n\nThe letter has reached the authorities. Its signatories could serve as contacts and witnesses, or receive only a written reply."
 ctc_china_april.14.a:0 "Invite the signatories to act as contacts and witnesses."
 ctc_china_april.14.b:0 "Reply in writing without adding negotiating seats."
 ctc_china_april.14.c:0 "Restrict circulation and criticize the petition."
 ctc_china_april.16.t:0 "Reports from the Provinces"
 ctc_china_april.16.desc:0 "Mourning and demonstrations spread beyond Beijing. Reports from Xi'an and Changsha mention localized clashes and damage, while other accounts describe peaceful assemblies. Distinct kinds of events arrive at the center in the same batch.\n\nHow these reports are used will shape the national assessment. Local police must handle specific offenses, while political decision-makers need to know which facts remain unverified."
 ctc_china_april.16.a:0 "Verify each case; distinguish assemblies from offenses."
 ctc_china_april.16.b:0 "Treat this as evidence of the movement's overall escalation."
 ctc_china_april.16.c:0 "Request further evidence and withhold judgment."
 ctc_china_april.17.t:0 "An Autonomous Student Federation"
 ctc_china_april.17.desc:0 "Students begin forming autonomous inter-university organizations to coordinate marches and dialogue. Selection, mandates and terms of representatives remain disputed; official student organizations no longer speak for all participants.\n\nThe government cannot choose the students' representatives, but must decide whom it will meet and how it will verify their authority."
 ctc_china_april.17.a:0 "Meet representatives chosen by autonomous organizations."
 ctc_china_april.17.b:0 "Recognize only official student organizations."
 ctc_china_april.17.c:0 "Verify campus mandates before judging the organizations."
 ctc_china_april.19.t:0 "The Beijing Party Committee's Report"
 ctc_china_april.19.desc:0 "The Beijing Party Committee reports to the center, emphasizing organization and public order. Material held by schools, hospitals and petition offices may not appear in that report.\n\nHow the leadership hears the situation will shape the next meeting. Sources need cross-checking, with observed facts distinguished from the authors' judgments."
 ctc_china_april.19.a:0 "Also hear schools, hospitals and social representatives."
 ctc_china_april.19.b:0 "Rely mainly on the municipal committee's report."
 ctc_china_april.19.c:0 "Cross-check the evidence first."
 ctc_china_april.20.t:0 "The Leadership's Judgment"
 ctc_china_april.20.desc:0 "Situation reports have reached the center. Advocates of restoring order regard the movement as a challenge to the political system; advocates of negotiation want specific demands, student actions and isolated clashes considered separately.\n\nThis judgment will guide propaganda and administrative agencies. The editorial is not yet in print, leaving one final opportunity to clarify the internal position."
 ctc_china_april.20.a:0 "Separate social demands from public-order issues."
 ctc_china_april.20.b:0 "Define the movement as comprehensive political confrontation."
 ctc_china_april.20.c:0 "Reserve judgment and continue observing."
 ctc_china_april.23.t:0 "The World Economic Herald"
 ctc_china_april.23.desc:0 "In Shanghai, the World Economic Herald's coverage of Hu Yaobang's death sparks a dispute. Authorities demand changes to its pages and a reorganization, proposing action against editor-in-chief Qin Benli. The editors defend their reporting.\n\nThe center must respond. Other newspapers will watch whether it supports the editors, endorses the measures or reviews the procedure."
 ctc_china_april.23.a:0 "Support the existing editorial team."
 ctc_china_april.23.b:0 "Uphold the reorganization and personnel measures."
 ctc_china_april.23.c:0 "Suspend further action and review the procedure."
 ctc_china_april.24.t:0 "The Reporters' Copy"
 ctc_china_april.24.desc:0 "Reporters from Science and Technology Daily and other newspapers continue interviewing people on campuses and streets. Their observations and interviewees' accounts do not always match official bulletins. Editors ask what may be printed.\n\nPress reform remains undecided, but these verified reports cannot stay in drawers indefinitely."
 ctc_china_april.24.a:0 "Allow verified reporting from the scene."
 ctc_china_april.24.b:0 "Require a unified reporting line."
 ctc_china_april.26.t:0 "After the Meeting"
 ctc_china_april.26.desc:0 "The meeting has ended, but the government bulletin differs from accounts students bring back to campus. Some participants believe answers were given; others heard only promises of further discussion.\n\nWho confirms the minutes and how disagreements are published will affect whether the next negotiators retain their constituents' trust."
 ctc_china_april.26.a:0 "Publish minutes confirmed by both sides."
 ctc_china_april.26.b:0 "Publish only the government's summary."
 ctc_china_april.26.c:0 "Allow both sides to publish their own views."
 ctc_china_april.27.t:0 "Dividing Central Responsibilities"
 ctc_china_april.27.desc:0 "[CTCAprilReturnContext]\n\nPrevious contacts, editorials and orders now need continuing responsibility. Retaining the general secretary's office does not automatically confer authority to negotiate for the center. The new division of duties must state who can make promises and who must implement them."
 ctc_china_april.27.a:0 "Reaffirm Zhao Ziyang's responsibility for negotiations."
 ctc_china_april.27.b:0 "Retain his title but transfer crisis management."
 ctc_china_april.27.c:0 "Establish temporary collective coordination."
 ctc_china_april.28.t:0 "Revising the Judgment"
 ctc_china_april.28.desc:0 "The hardline editorial remains an unavoidable issue in dialogue. Ceasing to repeat it does not invalidate its published judgment; an open revision will face resistance within the party and propaganda system.\n\nBefore further contact with students, the leadership must explain whether the newspaper's assessment still represents current policy."
 ctc_china_april.28.a:0 "Formally revise the editorial's judgment of the movement."
 ctc_china_april.28.a_note:0 "Retains the record of the editorial and march; subsequent events use the revised judgment."
 ctc_china_april.28.b:0 "Leave the text standing but stop reinforcing it."
 ctc_china_april.28.c:0 "Reaffirm the original judgment."
 ctc_china_april.29.t:0 "A Rescheduled Meeting"
 ctc_china_april.29.desc:0 "The postponed meeting has finally been arranged. Student representatives want to know what can be discussed; government staff need an agenda they can implement.\n\nThe date may change, but representative credentials and the authority of replies still require direct answers."
 ctc_china_april.29.a:0 "Confirm representatives and agenda, then meet."
 ctc_china_april.30.t:0 "The Petition Still Waiting"
 ctc_china_april.30.desc:0 "Days after accepting the petition, departments have still given no reply. The petitioners ask again what can be discussed and when a clear response will come.\n\nThe government can begin itemized replies or explain which matters it will not yet consider. Another acknowledgment alone will struggle to preserve trust."
 ctc_china_april.30.a:0 "Begin itemized replies."
 ctc_china_april.30.b:0 "Explain which matters will not yet be considered."
 CTC_APRIL_ZHAO_RETURNED:0 "Zhao Ziyang returns to Beijing after his North Korea visit. Decisions taken in his absence and disputes left unresolved now await him."
 CTC_APRIL_ZHAO_STAYED:0 "The North Korea visit has been postponed and Zhao Ziyang remains in Beijing. His presence has not ended disagreements within the leadership; authority over the response still needs clarification."
