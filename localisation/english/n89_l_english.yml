l_english:
 N89_BOOKMARK:0 "1989"
 N89_BOOKMARK_DESC:0 "The Cold War enters its fourth decade. Moscow is attempting to reshape the Soviet Union, while the Berlin Wall still divides Europe. East Asia's factories and ports work day and night, yet cracks are appearing in the established order.\n\nIn China, reform has completed its first decade. Growth has transformed lives while raising questions about prices, distribution and power. The economic rectification announced last autumn must now reach every loan, investment and wage packet."
 N89_COUNTRY_DESC:0 "The economy is still growing, but many households feel increasingly squeezed. Economic rectification, clean government and foreign relations confront the central leadership together, as competing reform proposals seek room within the existing system."
 N89_GOVERNMENT:0 "Zhao Ziyang"
 N89_GOVERNMENT_DESC:0 "General Secretary of the Communist Party of China. Li Peng heads the State Council, while party elders and competing views within the party continue to shape major decisions."
 n89_credit_restraint:0 "The Construction Cost of Credit Restraint"
 n89_credit_restraint_desc:0 "Some projects have been suspended and new lending approvals tightened. Overheated investment is cooling, while contractors and local governments begin to bear the costs of adjustment."
 N89_PRC_opening:0 "Ten Years After Reform Began"
 N89_PRC_opening_desc:0 "Ten years ago, new policies showed farmers, workers and enterprises that change was possible. Today, prices in city shops keep rising, while projects launched by competing local governments still await loans. The center has announced economic rectification. As the new year begins, each department must answer a concrete question: what must continue, and what should stop?"
 N89_PRC_adjustment:0 "Implement Economic Rectification"
 N89_PRC_adjustment_desc:0 "Cutting investment, stabilizing markets and protecting production often draw on the same funds once instructions reach the localities. Rectification needs priorities. Only by comparing departmental plans can central decisions become practical action."
 N89_PRC_prices:0 "Restrain Overheated Investment"
 N89_PRC_prices_desc:0 "Construction sites need steel and cement, enterprises need loans, and local authorities want projects operating quickly. Expanding investment is crowding out raw materials and credit. Suspending nonessential projects can ease shortages, but money already invested and workers awaiting work require separate arrangements."
 N89_PRC_employment:0 "Protect Essential Production"
 N89_PRC_employment_desc:0 "Some factory buildings can wait; some production lines cannot stop for a day. Energy, transport and key industries need steady working capital, or investment cuts will soon affect wages and supplies. Verify these enterprises' needs before allocating funds."
 N89_PRC_supply:0 "Secure Basic Supplies"
 N89_PRC_supply_desc:0 "Residents see price tags; supply departments see warehouses, railways and purchasing plans. Grain, cooking oil, meat and daily necessities must be checked item by item. Better transport and allocation can bring scarce goods to market in time."
 N89_PRC_rural:0 "Secure Spring Farming Inputs"
 N89_PRC_rural_desc:0 "Spring planting will not wait for budgets. If fertilizer, pesticides and farm diesel arrive late, the consequences will emerge in autumn. Agricultural departments must coordinate with supply cooperatives and transport services to deliver inputs where they are needed."
 N89_PRC_political:0 "Reform Administration and Curb Corruption"
 N89_PRC_political_desc:0 "Financial investigations often lead to approval powers, personal connections and departmental interests. Rectification cannot demand concessions only from firms and households. Government spending, officials' responsibilities and administrative procedures also need scrutiny."
 N89_PRC_discipline:0 "Enforce Financial Discipline"
 N89_PRC_discipline_desc:0 "One project may draw on several loans, while an allocation may already have changed purpose. Audit and finance departments must reconcile accounts and investigate unauthorized approvals and diverted funds. Their reports must say where the money went and who is responsible."
 N89_PRC_oversight:0 "Prepare the Administrative Litigation Law"
 N89_PRC_oversight_desc:0 "The Administrative Litigation Law has passed and will take effect on October 1 next year. Courts must learn their new jurisdiction, while administrative bodies organize procedures and case files. Much preparation remains before the law becomes part of everyday life."
 N89_PRC_voices:0 "Review Public Letters and Local Views"
 N89_PRC_voices_desc:0 "Letters discuss housing, prices, official conduct and matters left unanswered for years. Material scattered across departments obscures the larger picture. Bringing these views together can at least show decision-makers which problems recur."
 N89_PRC_channels:0 "Establish Crisis Negotiation Channels"
 N89_PRC_channels_desc:0 "Street demands can no longer be answered by passing reports up the hierarchy. The government needs representatives empowered to reply, explaining what can be discussed and what still requires approval. Whether the other side accepts remains its own decision."
 N89_PRC_education:0 "Deliver Annual Education Funding"
 N89_PRC_education_desc:0 "The government work report again calls for education development. Schools need more than words: teachers' pay, teaching equipment and operating funds must appear in budgets. Check whether allocations have arrived, then address the backlog of local difficulties."
 N89_PRC_budget:0 "Cut Nonessential Administrative Spending"
 N89_PRC_budget_desc:0 "Meetings, receptions, vehicles and official buildings all have their defenders. Government agencies cannot stand apart when finances tighten. Cutting unnecessary expenditure frees funds and sets a standard for rectification elsewhere."
 N89_PRC_summit:0 "Prepare the Sino-Soviet Summit"
 N89_PRC_summit_desc:0 "Normalization of Sino-Soviet relations has reached a critical stage. Borders, regional affairs and visit arrangements require careful preparation. A successful summit depends on months of quiet consultation and coordination."
 N89_PRC_contacts:0 "Maintain Foreign Economic Contacts"
 N89_PRC_contacts_desc:0 "Opening to the outside world remains policy, although domestic adjustment requires many joint projects to be recalculated. Maintaining working contacts, explaining policy changes and resolving practical investment and trade problems can reduce unnecessary uncertainty."
 N89_PRC_review:0 "Review First-Quarter Policy"
 N89_PRC_review_desc:0 "The first quarter is ending and departmental reports are arriving. Which projects have stopped, which supplies remain scarce, and which allocations exist only on paper must all be checked again. The next stage cannot rest solely on January's plans."
 n89_china.1.t:0 "Papers for the New Year"
 n89_china.1.d:0 "The first documents of 1989 arrive on the desk. Last year's attempted price reform and panic buying remain fresh memories. Economic rectification is now a task every department must implement.\n\nReform has changed life everywhere, but accumulated tensions are harder to avoid. Enterprises seek loans, residents watch food prices, and intellectuals debate power and reform. The leadership must also prepare for a Sino-Soviet summit and a visit by the new American president.\n\nThe year's work begins with these concrete, complicated matters."
 n89_china.1.a:0 "Bring in the departmental plans."
 n89_china.10.t:0 "An Open Letter"
 n89_china.10.d:0 "On January 6, Fang Lizhi writes to Deng Xiaoping calling for an amnesty for political prisoners, including Wei Jingsheng. After ten years of reform, discussion of economic change increasingly raises questions about political life.\n\nThe letter brings some intellectual demands into public view. The relevant departments must review the questions it raises and the opinions that follow."
 n89_china.10.a:0 "Forward the letter to the relevant departments."
 n89_china.10.b:0 "Compile the related opinions as well."
 n89_china.11.t:0 "Before the Summit"
 n89_china.11.d:0 "On February 4, Deng Xiaoping meets Soviet Foreign Minister Eduard Shevardnadze in Shanghai. After decades of difficult relations, China and the Soviet Union now have an opportunity for normalization.\n\nSummit preparations continue. The foreign affairs departments must coordinate the agenda and reception arrangements with other agencies, adding several urgent documents to their existing workload."
 n89_china.11.a:0 "Continue preparations as planned."
 n89_china.11.b:0 "Assign more staff and accelerate coordination."
 n89_china.12.t:0 "Bush Arrives in Beijing"
 n89_china.12.d:0 "On February 25, US President George Bush arrives in Beijing. The new president once worked in China and knows the city; for Chinese leaders, the visit offers an important chance to establish relations with the new administration.\n\nReceptions, talks and departmental preparations have been scheduled. Differences remain, and there is much to discuss."
 n89_china.12.a:0 "Hold the talks as planned."
 n89_china.24.t:0 "After the Talks"
 n89_china.24.d:0 "On February 26, Zhao Ziyang meets Bush. Foreign relations and domestic reform both demand attention. The two sides must maintain contact and pass matters raised in the talks to the relevant departments.\n\nThe diplomatic calendar continues. Zhao's planned visit to North Korea in late April is also entering preparation."
 n89_china.24.a:0 "Compile the record and distribute it."
 n89_china.13.t:0 "Last Year's Accounts"
 n89_china.13.d:0 "The State Statistical Bureau publishes its report for the previous year. Production continues to grow, while supply imbalances and rising prices are equally clear in the figures. The achievements of growth and the pressures on households and firms appear in the same report.\n\nThe year's plans must be checked against these results. How far investment should contract, and how much protection production and market supplies can receive, need more precise answers."
 n89_china.13.a:0 "Recheck investment and supply plans."
 n89_china.13.b:0 "Check essential commodity supplies first."
 n89_china.14.t:0 "Economic Rectification"
 n89_china.14.d:0 "On March 20, Li Peng presents the government work report to the second session of the Seventh National People's Congress. Improving the economic environment, rectifying economic order and deepening reform define the year's work.\n\nThe report covers investment, production, agriculture, education and much else. Departments must now translate annual tasks into budgets and implementation plans."
 n89_china.14.a:0 "Departments should implement the annual program."
 n89_china.14.b:0 "Require reports on local implementation as well."
 n89_china.15.t:0 "The Administrative Litigation Law"
 n89_china.15.d:0 "On April 4, the second session of the Seventh National People's Congress passes the Administrative Litigation Law of the People's Republic of China. Citizens, legal persons and other organizations will have a specific legal basis for challenging administrative acts.\n\nThe law takes effect on October 1, 1990. Its text has passed, but preparations in courts and administrative agencies are only beginning."
 n89_china.15.a:0 "Begin preparations for implementation."
 n89_china.16.t:0 "The Death of Hu Yaobang"
 n89_china.16.d:0 "On April 15, Hu Yaobang dies in Beijing. As the news spreads, mourners begin to gather. Remembrance of the former general secretary also recalls the political life of recent years.\n\nArrangements for mourning, and responsibility for receiving public submissions, soon require a response from the central leadership and Beijing authorities."
 n89_china.16.a:0 "Arrange mourning and staff to receive public views."
 n89_china.16.b:0 "Follow the established arrangements."
 n89_china.17.t:0 "The Submitted Demands"
 n89_china.17.d:0 "Students petition the National People's Congress, calling for a reassessment of Hu Yaobang, disclosure of officials' and relatives' incomes, better education conditions, and changes in the press and publishing. As participation grows, the petition's contents continue to change.\n\nThe government has received the material, but an acknowledgment alone is not an answer. Who meets the petitioners, what can be discussed and when a reply arrives will shape what follows."
 n89_china.17.a:0 "Accept the petition and arrange itemized replies."
 n89_china.17.b:0 "Accept only matters concerning mourning."
 n89_china.17.c:0 "Accept it without promising a reply deadline."
 n89_china.18.t:0 "Before the Great Hall"
 n89_china.18.d:0 "On April 22, Hu Yaobang's memorial service is held. Outside the Great Hall of the People, three students kneel to present a petition and ask to meet officials.\n\nMore people wait in the square for an answer. Whether government representatives can make commitments, and whether the next arrangements can be clearly conveyed, can no longer be left to routine referrals."
 n89_china.18.a:0 "Send authorized representatives to receive the petition."
 n89_china.18.b:0 "Accept written material without promising a meeting."
 n89_china.18.c:0 "Do not arrange an official meeting at the site."
 n89_china.19.t:0 "The Scheduled Journey"
 n89_china.19.d:0 "April 23, the scheduled date for the North Korea visit, has arrived. The diplomatic journey has long been prepared, but events in Beijing are still developing.\n\nA decision is needed on whether Zhao Ziyang travels as planned. Whatever the arrangement, the leaders remaining in Beijing need clear responsibilities, an assessment of student demands and authority for continuing contact."
 n89_china.19.a:0 "Postpone the visit and coordinate in Beijing."
 n89_china.19.b:0 "Depart on schedule and retain the existing division of duties."
 n89_china.19.c:0 "Depart on schedule and let conservatives direct the response."
 n89_china.20.t:0 "An Editorial Awaiting Publication"
 n89_china.20.d:0 "The leadership remains divided over the student movement. An editorial about to be published may turn these judgments into the official line followed across the country.\n\nConservatives demand a firm statement of the situation's gravity and a rapid restoration of order. Advocates of dialogue fear harsh labeling will obstruct contact. Once printed, the words cannot easily be withdrawn as an internal discussion."
 n89_china.20.a:0 "Publish the hardline editorial."
 n89_china.20.b:0 "Acknowledge the demands and call for dialogue."
 n89_china.20.c:0 "Delay publication and coordinate a response."
 n89_china.21.t:0 "Into the Streets"
 n89_china.21.d:0 "On April 27, students march through Beijing against the previous day's characterization of their movement. Many residents watch along the route, and the situation confronting the government grows more complicated.\n\nPersonnel on duty need clear instructions. Whether to let the march pass and seek contact, or impose further restrictions, must be decided and communicated quickly."
 n89_china.21.a:0 "Allow the march and contact representatives."
 n89_china.21.b:0 "Give way at the scene and avoid escalation."
 n89_china.21.c:0 "Tighten restrictions and refuse contact."
 n89_china.22.t:0 "At the Table"
 n89_china.22.d:0 "Dialogue is being arranged, but genuine talks depend on how representatives are selected, what enters the agenda and whether replies carry authority.\n\nExisting channels must finally confront these questions. A meeting is only a beginning; each side waits for credible action from the other."
 n89_china.22.a:0 "Agree jointly on representatives and the agenda."
 n89_china.22.b:0 "Meet under a government-set agenda."
 n89_china.22.c:0 "Postpone and publish the matters requiring verification."
 n89_china.23.t:0 "April Draws to a Close"
 n89_china.23.d:0 "On April's final day, the documents on the desk look very different from January's. Economic work continues, but streets and campuses demand more direct answers. Promises made, opinions published and unanswered demands will all carry into next month.\n\nReformist influence: [?n89_r|0]  Conservative influence: [?n89_h|0]\nTrust in dialogue: [?n89_trust|0]"
 n89_china.23.a:0 "Keep these questions on the agenda."
 n89_china.30.t:0 "Coordinating a Response"
 n89_china.30.d:0 "Judgments of the situation still differ, while implementing agencies await instructions. Continuing negotiations need clear authority; a unified response also requires persuading those who disagree.\n\nProgress depends on sufficient support within the party. At the least, working contacts should not collapse amid the argument."
 n89_china.30.a:0 "Build support for a negotiating mandate."
 n89_china.30.b:0 "Emphasize unified implementation."
 n89_china.30.c:0 "Accept disagreement and retain working contacts."
 n89_governance:0 "Central Government Briefing"
 n89_governance_desc:0 "Economic rectification has been ordered. Supplies, education funding and financial discipline still need individual checks, while factories and local institutions await answers to their concerns."
 n89_supply_decision:0 "Increase Supplies of Daily Necessities"
 n89_supply_decision_desc:0 "Check inventories and transport, then allocate additional daily necessities.\n\nStability +1%. Available again after thirty days."
 n89_education_budget:0 "Check Annual Education Allocations"
 n89_education_budget_desc:0 "The education program has been adopted, but delivery of funds still needs verification.\n\nTrust in dialogue +2. Once this quarter."
 n89_audit:0 "Audit Financial Discipline"
 n89_audit_desc:0 "Check departmental use of funds and address diversion and unauthorized expenditure.\n\nTrust in dialogue +2. Once this quarter."
 n89_worker_contact:0 "Collect Workers' Views Through Existing Unions"
 n89_worker_contact_desc:0 "Use existing unions to collect views on wages, benefits and production, and refer them to the relevant agencies.\n\nTrust in dialogue +2. Once this quarter."
 n89_coordination:0 "Arrange Party Coordination During the Crisis"
 n89_coordination_desc:0 "Convene the relevant officials to coordinate the response and clarify negotiating and executive authority.\n\nNo similar coordination for forty-five days. If only working contacts can be maintained, refund 10 political power."
