 n89_handover.1.t:0 "The Hong Kong Handover"
 n89_handover.1.d:0 "At midnight on July 1, China and Britain complete the transfer of government in Hong Kong. The Hong Kong Special Administrative Region of the People's Republic of China is established, and its new administration assumes office. Hong Kong enters a new phase under One Country, Two Systems."
 n89_handover.1.a:0 "Complete the handover and maintain public services."
 n89_handover.2.t:0 "The Macau Handover"
 n89_handover.2.d:0 "At midnight on December 20, China and Portugal complete the transfer of government in Macau. The Macau Special Administrative Region of the People's Republic of China is established. After the ceremony, the new administration takes over everyday work."
 n89_handover.2.a:0 "Complete the handover and maintain public services."
