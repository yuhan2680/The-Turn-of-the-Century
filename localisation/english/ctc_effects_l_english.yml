 CTC_EFFECT_ctc_china_may_1_a:0 "Reformist influence: §Y+4§!\nTrust in dialogue: §Y+5§!"
 CTC_EFFECT_ctc_china_may_1_b:0 "Conservative influence: §Y+3§!\nTrust in dialogue: §Y-3§!"
 CTC_EFFECT_ctc_china_may_2_a:0 "Trust in dialogue: §Y+5§!"
 CTC_EFFECT_ctc_china_may_2_b:0 "Conservative influence: §Y+3§!\nTrust in dialogue: §Y-5§!"
 CTC_EFFECT_ctc_china_may_4_a:0 "Reformist influence: §Y+5§!\nTrust in dialogue: §Y+7§!\nEstablishes a working team for continuing negotiations."
 CTC_EFFECT_ctc_china_may_4_b:0 "Conservative influence: §Y+5§!\nTrust in dialogue: §Y-7§!"
 CTC_EFFECT_ctc_china_may_4_c:0 "Trust in dialogue: §Y+6§!\nWorker representatives can attend subsequent talks.\nEstablishes a working team for continuing negotiations."
 CTC_EFFECT_ctc_china_may_5_a:0 "Recognizes worker representatives and opens labor talks; if conditions worsen, their organizations can also oppose martial law.\nTrust in dialogue: §Y+5§!"
 CTC_EFFECT_ctc_china_may_5_b:0 "Rejects autonomous workers' organizations; direct entry to joint labor talks is unavailable.\nConservative influence: §Y+4§!\nTrust in dialogue: §Y-4§!"
 CTC_EFFECT_ctc_china_may_6_a:0 "Imposes martial law and begins military-civilian confrontation. The final outcome is not yet decided.\nConservative influence: §Y+8§!\nReformist influence: §Y-8§!\nTrust in dialogue: §Y-10§!"
 CTC_EFFECT_ctc_china_may_6_b:0 "Authorizes reformist negotiations; a reform agreement must subsequently be reached and implemented.\nReformist influence: §Y+6§!"
 CTC_EFFECT_ctc_china_may_6_c:0 "Workers' organizations enter joint talks, opening the strike-accord route.\nTrust in dialogue: §Y+4§!"
 CTC_EFFECT_ctc_china_may_7_a:0 "Establishes joint oversight, opening the option to sign a reform agenda.\nTrust in dialogue: §Y+5§!"
 CTC_EFFECT_ctc_china_may_7_b:0 "Workers can jointly propose restart conditions, opening the labor rights accord.\nStoppages continue: gains 'Factory Stoppages', removed when an accord takes effect or the crisis ends."
 CTC_EFFECT_ctc_china_may_7_c:0 "Conservative influence: §Y+4§!"
 CTC_EFFECT_ctc_china_may_7_d:0 "Supports workers opposing martial law; military support can be sought later.\nStoppages continue: gains 'Factory Stoppages', removed when an accord takes effect or the crisis ends."
 CTC_EFFECT_ctc_china_may_8_a:0 "Forms a reform agreement; representatives must ratify it and its first stage must be fulfilled before the final June settlement.\nTrust in dialogue: §Y+5§!"
 CTC_EFFECT_ctc_china_may_8_b:0 "Forms a labor accord; workers' organizations must ratify it and its first stage must be fulfilled before the left-reform outcome."
 CTC_EFFECT_ctc_china_may_8_c:0 "A revolutionary committee can be formed in June, beginning civil war. The political program is chosen after victory."
 CTC_EFFECT_ctc_china_may_8_d:0 "Conservative influence: §Y+5§!\nTrust in dialogue: §Y-8§!"
 CTC_EFFECT_ctc_china_may_9_a:0 "Troops carry out the order the next day and casualty reports arrive; resolving them leads to suppression and completes 'Stability Above All'."
 CTC_EFFECT_ctc_china_may_9_b:0 "Triggers the reform outcome the next day; confirmation completes 'Long Live Democracy'."
 CTC_EFFECT_ctc_china_may_9_c:0 "Triggers the labor-accord outcome the next day; confirmation completes 'Workers' Equality'."
 CTC_EFFECT_ctc_china_may_9_d:0 "Triggers the revolutionary outcome the next day; confirmation completes 'A Second Revolution' and starts civil war."
 CTC_EFFECT_ctc_china_may_10_a:0 "Trust in dialogue: §Y+6§!\nPublishes initial replies and proceeds to May's representative mandates and implementation arrangements."
 CTC_EFFECT_ctc_china_may_10_b:0 "Trust in dialogue: §Y-2§!"
 CTC_EFFECT_ctc_china_may_10_c:0 "Reformist influence: §Y-3§!\nTrust in dialogue: §Y-6§!"
 CTC_EFFECT_ctc_china_may_10_d:0 "Publishes initial replies and proceeds to May's representative mandates and implementation arrangements.\nTrust in dialogue: §Y+12§!"
 CTC_EFFECT_ctc_china_may_11_a:0 "Confirms student representatives' mandates, enabling subsequent ratification and worker-student alliance conditions.\nTrust in dialogue: §Y+3§!"
 CTC_EFFECT_ctc_china_may_11_b:0 "Conservative influence: §Y+1§!\nTrust in dialogue: §Y-3§!\nRepresentative mandates remain disputed, preventing a reform accord or a worker-student conference."
 CTC_EFFECT_ctc_china_may_11_c:0 "Confirms student representatives' mandates, enabling subsequent ratification and worker-student alliance conditions.\nTrust in dialogue: §Y+2§!"
 CTC_EFFECT_ctc_china_may_12_a:0 "Zhao Ziyang receives central signing authority; continued negotiations must still be secured at the martial law meeting.\nReformist influence: §Y+8§!\nConservative influence: §Y-6§!"
 CTC_EFFECT_ctc_china_may_12_b:0 "Revokes Zhao Ziyang's authority; reformist influence is capped at 20 and the reformist outcome closes.\nReformist influence: §Y-15§!\nConservative influence: §Y+15§!"
 CTC_EFFECT_ctc_china_may_12_c:0 "Continues collective coordination without giving reformists independent signing authority.\nConservative influence: §Y+1§!"
 CTC_EFFECT_ctc_china_may_13_a:0 "Establishes a jointly authorized worker-student conference, able to organize common opposition after martial law.\nTrust in dialogue: §Y+3§!"
 CTC_EFFECT_ctc_china_may_13_b:0 "Trust in dialogue: §Y+1§!"
 CTC_EFFECT_ctc_china_may_13_c:0 "Workers lack independent seats, so the labor accord cannot receive valid ratification.\nTrust in dialogue: §Y-4§!"
 CTC_EFFECT_ctc_china_may_14_a:0 "Supporting troops join common command, establishing the military conditions for revolution."
 CTC_EFFECT_ctc_china_may_14_b:0 "Soldiers mediate without joining revolutionary command; this does not permit civil war.\nTrust in dialogue: §Y+1§!"
 CTC_EFFECT_ctc_china_may_15_a:0 "Representative organizations ratify the agreement; implementation must be decided on June 1.\nTrust in dialogue: §Y+4§!"
 CTC_EFFECT_ctc_china_may_15_b:0 "Without organizational ratification, the reform and labor-accord outcomes remain unavailable.\nTrust in dialogue: §Y-5§!"
 CTC_EFFECT_ctc_china_may_16_a:0 "Fulfills initial commitments, allowing the agreed settlement to be implemented on June 3.\nTrust in dialogue: §Y+5§!"
 CTC_EFFECT_ctc_china_may_16_b:0 "Refuses the first implementation stage, preventing an agreement outcome; the crisis continues.\nTrust in dialogue: §Y-10§!"
 CTC_EFFECT_ctc_china_may_17_b:0 "Conservative influence: §Y+3§!"
 CTC_EFFECT_ctc_china_may_18_a:0 "Jiang Zemin becomes general secretary; central responsibilities update accordingly."
 CTC_EFFECT_ctc_china_may_19_a:0 "No numerical change."
 CTC_EFFECT_ctc_china_may_19_b:0 "No numerical change."
 CTC_EFFECT_ctc_china_outcome_1_a:0 "Completes 'Stability Above All' and grants 'After June'. Reformist influence becomes 10, conservative influence 85 and trust in dialogue 10."
 CTC_EFFECT_ctc_china_outcome_2_a:0 "Completes 'Long Live Democracy'. Zhao Ziyang leads a reform government with elections; 'Reform Agreement' replaces 'Economic Rectification'. Reformist influence becomes 80 and conservative influence 25."
 CTC_EFFECT_ctc_china_outcome_3_a:0 "Completes 'Workers' Equality'. The Labor Consultation Council directs affairs; 'Labor Accord' replaces 'Economic Rectification'."
 CTC_EFFECT_ctc_china_outcome_4_a:0 "Completes 'A Second Revolution' and keeps you in control of the revolutionary side. The old government retains 96% of its original army, all naval forces and 98% of its air force. Revolutionaries mobilize 48 four-battalion militia divisions at 80% manpower and 55% equipment, with only a few regular units joining. The postwar program requires victory first."
 CTC_EFFECT_ctc_china_outcome_5_a:0 "Completes 'Worker-Student Alliance' and enables elections. Worker-Student Government: stability +10%, research speed +12%, military factory output +15%, consumer goods factor −5%, political power gain +10%. Also grants three years of 'Reconstruction Mobilization': construction speed +30%, factory repair speed +75%, army organization +10%, supply consumption −15%; a one-time grant of 150 political power and 75 army experience."
 CTC_EFFECT_ctc_china_outcome_5_b:0 "Completes 'Continuing Revolution'. Continuing Revolution: military factory output +25%, dockyard output +10%, production efficiency growth +20%, army organization +15%, recruitable population +1%, consumer goods factor −4%. Also grants three years of 'Reconstruction Mobilization': construction speed +30%, factory repair speed +75%, army organization +10%, supply consumption −15%; a one-time grant of 150 political power and 75 army experience."
