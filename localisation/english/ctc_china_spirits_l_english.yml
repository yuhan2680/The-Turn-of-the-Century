l_english:
 ctc_prc_governance_adjustment:0 "Economic Rectification"
 ctc_prc_governance_adjustment_desc:0 "In autumn 1988, the leadership decided to restrain overheated investment and restore economic order. Local projects require review, while tighter credit strains some enterprises' working capital. Governments must control prices while keeping production running."
 ctc_prc_dual_prices:0 "Dual-Track Pricing"
 ctc_prc_dual_prices_desc:0 "Planned supplies are allocated at official prices, while goods outside the plan trade at market prices. Two prices for the same commodity give firms operating room, but also make permits, connections and resale profitable."
 ctc_prc_army_reorganization:0 "After Reorganization"
 ctc_prc_army_reorganization_desc:0 "The million-man reduction is complete, and ground forces are reorganizing into group armies. Numbers have fallen, but combined-arms training, officer education and equipment renewal still need work. Changing organization alone cannot meet the requirements of modern warfare."
 ctc_prc_supply_guarantees:0 "Supply Guarantees"
 ctc_prc_supply_guarantees_desc:0 "Transport and supply departments are addressing grain, foodstuffs and daily necessities item by item. Whether goods arrive at stations and shops on time directly affects households' ability to withstand rectification."
 ctc_prc_june_aftermath:0 "After June"
 ctc_prc_june_aftermath_desc:0 "Force has ended the movement in the streets; investigations and arrests follow. The leadership has regained political control, but casualties, silence and lost trust will remain in social life for years."
 ctc_prc_reform_agreement:0 "Reform Agreement"
 ctc_prc_reform_agreement_desc:0 "Public oversight and political participation are written into the agreement. Existing agencies must follow new procedures, while newspapers, students and local representatives question how each promise is being fulfilled."
 ctc_prc_labour_compact:0 "Labor Accord"
 ctc_prc_labour_compact_desc:0 "Worker representatives have won rights to organize, negotiate wages and oversee enterprises. Returning to work no longer means dissolving their organizations. Distribution and labor protection must now be resolved through lasting negotiating institutions."
 ctc_prc_general_strike:0 "Factory Stoppages"
 ctc_prc_general_strike_desc:0 "Workers stop production to demand organizing and negotiating rights. Output suffers, while individual institutions coordinate essential supplies and public services. Representatives and the government are still discussing restart conditions."
 ctc_prc_revolutionary_coalition:0 "Revolutionary United Front"
 ctc_prc_revolutionary_coalition_desc:0 "A few supporting units bring officers and weapons; most recruits have just left workshops and campuses. Many militia members still lack rifles, and joint command cannot instantly turn local pickets into a regular army. The old government retains most forces and heavy equipment."
 ctc_prc_reconstruction_mobilization:0 "Reconstruction Mobilization"
 ctc_prc_reconstruction_mobilization_desc:0 "After the ceasefire, engineers and local construction teams repair railways, power stations and factories. Troops return requisitioned warehouses, unions register returnees, and universities reopen. Wartime organizational experience is being turned toward restoring livelihoods and production."
 ctc_prc_social_democratic_settlement:0 "Worker-Student Government"
 ctc_prc_social_democratic_settlement_desc:0 "Elected representatives enter parliament, independent unions retain organizing rights, and universities resume teaching and research. The wartime alliance places land, factories and public budgets under written procedures. Institutions won together must also accommodate future opposition."
 ctc_prc_maoist_settlement:0 "Continuing Revolution"
 ctc_prc_maoist_settlement_desc:0 "Local representatives and production organizations join reconstruction. The army opens cadre schools, while factories concentrate on restoring equipment and military supplies. Revolutionary committees extend wartime mobilization networks into local communities and require officials to face public oversight."
