l_english:
 CTC_PRC_crisis:0 "The Crisis Arrives"
 CTC_PRC_crisis_desc:0 "News of Hu Yaobang's death brings mourners together. Among wreaths and memorial couplets, discussion of corruption, prices and political reform grows. The leadership now faces more than an act of mourning.\n\n§LCompletes automatically with the existing event beginning the democracy movement. Cannot be started manually.§!"
 CTC_PRC_crisis_condition:0 "Completes automatically with the existing event beginning the democracy movement."
 CTC_PRC_stability:0 "Stability Above All"
 CTC_PRC_stability_desc:0 "Troops have carried out the suppression order, and the political leadership has regained the streets. Traffic resumes and offices reopen, but casualties, investigations and unanswered demands will not vanish with restored order. Conservatives have determined the response; political life will bear its consequences.\n\n§LCompletes when the conservative suppression outcome occurs and is confirmed in its event. Cannot be started manually.§!"
 CTC_PRC_stability_condition:0 "Completes when the conservative suppression outcome occurs and is confirmed in its event."
 ctc_china_outcome.1.t:0 "Stability Above All"
 ctc_china_outcome.1.d:0 "Troops have carried out the suppression order, and the political leadership has regained the streets. Traffic resumes and offices reopen, but casualties, investigations and unanswered demands will not vanish with restored order. Conservatives have determined the response; political life will bear its consequences."
 ctc_china_outcome.1.a:0 "Resume government work."
 CTC_PRC_democracy:0 "Long Live Democracy"
 CTC_PRC_democracy_desc:0 "The political reform agreement is entering implementation. Public discussion, oversight of power and participation must become institutions everyone can invoke, rather than demands at a negotiating table. Reformists have won this argument; their next test is making promises withstand everyday politics.\n\n§LCompletes when the reformist outcome occurs and is confirmed in its event. Cannot be started manually.§!"
 CTC_PRC_democracy_condition:0 "Completes when the reformist outcome occurs and is confirmed in its event."
 ctc_china_outcome.2.t:0 "Long Live Democracy"
 ctc_china_outcome.2.d:0 "The political reform agreement is entering implementation. Public discussion, oversight of power and participation must become institutions everyone can invoke, rather than demands at a negotiating table. Reformists have won this argument; their next test is making promises withstand everyday politics."
 ctc_china_outcome.2.a:0 "Put the agreement into practice."
 CTC_PRC_workers_equality:0 "Workers' Equality"
 CTC_PRC_workers_equality_desc:0 "The strike has forced all parties to reconsider rights inside the factory. Wage distribution, labor protection and worker representation enter an enforceable accord answering the autonomous federation's demands. Workers will return to their posts while retaining the ability to organize again for these rights.\n\n§LCompletes after the workers' strike produces a left-reform outcome and its event is confirmed. Cannot be started manually.§!"
 CTC_PRC_workers_equality_condition:0 "Completes after the workers' strike produces a left-reform outcome and its event is confirmed."
 ctc_china_outcome.3.t:0 "Workers' Equality"
 ctc_china_outcome.3.d:0 "The strike has forced all parties to reconsider rights inside the factory. Wage distribution, labor protection and worker representation enter an enforceable accord answering the autonomous federation's demands. Workers will return to their posts while retaining the ability to organize again for these rights."
 ctc_china_outcome.3.a:0 "Protect workers' rights under the accord."
 CTC_PRC_second_revolution:0 "A Second Revolution"
 CTC_PRC_second_revolution_desc:0 "The autonomous workers' federation's revolutionary program has gained support, and the struggle now concerns who holds power. Existing institutions and revolutionary organizations both seek the allegiance of troops, factories and local authorities. Disagreements unresolved at the table have entered a revolution whose outcome remains uncertain.\n\n§LCompletes when the workers' revolutionary outcome occurs and is confirmed in its event. Cannot be started manually.§!"
 CTC_PRC_second_revolution_condition:0 "Completes when the workers' revolutionary outcome occurs and is confirmed in its event."
 ctc_china_outcome.4.t:0 "A Second Revolution"
 ctc_china_outcome.4.d:0 "The autonomous workers' federation's revolutionary program has gained support, and the struggle now concerns who holds power. Existing institutions and revolutionary organizations both seek the allegiance of troops, factories and local authorities. Disagreements unresolved at the table have entered a revolution whose outcome remains uncertain."
 ctc_china_outcome.4.a:0 "The revolution has begun."
 CTC_PRC_worker_student_alliance:0 "Worker-Student Alliance"
 CTC_PRC_worker_student_alliance_desc:0 "After revolutionary victory, worker and student representatives put their wartime cooperation into a new political settlement. Parliament, elections and labor protection guide reconstruction, and revolutionary organizations must follow their own procedures. The coalition's task is to keep those who opposed the old order together within one institutional system.\n\n§LAfter revolutionary victory, choose the social-democratic program in the postwar settlement event. Cannot be started manually.§!"
 CTC_PRC_worker_student_alliance_condition:0 "After revolutionary victory, choose the social-democratic program in the postwar settlement event."
 CTC_PRC_continuing_revolution:0 "Continuing Revolution"
 CTC_PRC_continuing_revolution_desc:0 "Victory has not ended internal debate. Maoists argue that new institutions can also become detached from the people and demand continuing revolution as a principle of political life. Mass mobilization and political struggle will continue, and postwar institutions will be arranged accordingly.\n\n§LAfter revolutionary victory, choose the Maoist program in the postwar settlement event. Cannot be started manually.§!"
 CTC_PRC_continuing_revolution_condition:0 "After revolutionary victory, choose the Maoist program in the postwar settlement event."
 ctc_china_outcome.5.t:0 "After Victory"
 ctc_china_outcome.5.d:0 "The revolution has won. The common enemy has left the stage, exposing disagreements within the wartime alliance.\n\nSupporters of the worker-student alliance seek social democracy through elections, parliament and labor protection. Maoists call for continued mass mobilization to prevent new institutions from repeating the old path. The postwar government must choose between these programs."
 ctc_china_outcome.5.a:0 "Adopt the alliance's social-democratic program."
 ctc_china_outcome.5.b:0 "Adopt the Maoist program of continuing revolution."
