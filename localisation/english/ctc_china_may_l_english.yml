 CTC_MAY_EDITORIAL_HARD:0 "The hardline editorial remains unretracted. The gap between this speech and the established line makes the government's position harder to judge."
 CTC_MAY_EDITORIAL_REVISED:0 "The earlier judgment has been revised. Whether talks are actually arranged now determines the weight people give the speech."
 CTC_MAY_EDITORIAL_OPEN:0 "Whether the earlier room for dialogue becomes concrete arrangements now determines the weight people give the speech."
 CTC_MAY_CITY_MARTIAL:0 "Residents guard intersections to block martial law troops. Offices and factories debate the leadership's decision. Railways, buses, hospitals and food shops must still operate; stoppages would spread the deadlock further."
 CTC_MAY_CITY_LABOUR:0 "Some factories have stopped work. Workers demand clear wage negotiations, representative credentials and organizing rights before restarting. Joint talks must answer these conditions while keeping hospitals, water and essential transport running."
 CTC_MAY_CITY_REFORM:0 "The government has agreed to further talks. Representatives discuss withdrawal and the resumption of classes. Offices, schools and streets need implementation procedures and liaison staff trusted to explain matters to both sides."
