l_english:
 ctc_china_may.1.t:0 "The May Fourth Speech"
 ctc_china_may.1.desc:0 "Marchers return to the streets. At the Asian Development Bank's annual meeting, Zhao Ziyang speaks of the students' patriotism and advocates resolving the issues through democracy and the rule of law.\n\n[CTCMayEditorialContext]Students still want to know who will discuss their submitted demands and when the next answer will arrive."
 ctc_china_may.1.a:0 "Publish the dialogue arrangements."
 ctc_china_may.1.b:0 "Soften public statements without new commitments."
 ctc_china_may.2.t:0 "The Hunger Strike Begins"
 ctc_china_may.2.desc:0 "Students in the square announce a hunger strike, demanding a public government response. Stretchers, ambulances and people bringing water move through the crowd; hospitals begin admitting weakened students.\n\nThe Sino-Soviet summit approaches, but the square remains full. Medical departments must keep rescue routes open, while liaison staff await instructions on formal talks."
 ctc_china_may.2.a:0 "Keep emergency access open and send negotiators."
 ctc_china_may.2.b:0 "Provide medical aid; require an end to the strike before talks."
 ctc_china_may.3.t:0 "The Sino-Soviet Summit"
 ctc_china_may.3.desc:0 "Gorbachev arrives in Beijing. The welcome ceremony moves to the airport. Diplomacy continues, but foreign cameras repeatedly turn toward the square.\n\nA summit ending decades of confrontation cannot lightly be interrupted. Protocol staff recheck routes while negotiators continue preparing the talks."
 ctc_china_may.3.a:0 "Follow the revised reception schedule."
 ctc_china_may.4.t:0 "A Meeting Before the Cameras"
 ctc_china_may.4.desc:0 "Li Peng and student representatives sit at the same table. Television carries portions of the meeting into homes across the country, but disagreements over the hunger strike, negotiating credentials and the movement's characterization remain.\n\nOne meeting is insufficient. Continued personnel, an agenda and deadlines will determine whether the table is still there tomorrow."
 ctc_china_may.4.a:0 "Publish the next meeting's date and agenda."
 ctc_china_may.4.b:0 "End the hunger strike before discussing specific demands."
 ctc_china_may.4.c:0 "Invite worker representatives to the next meeting."
 ctc_china_may.5.t:0 "Workers' Voices"
 ctc_china_may.5.desc:0 "Autonomous workers' organizations begin operating openly near the square. Their concerns extend beyond campus: wages lag behind prices, factory directors hold growing power, and rumors of officials trading permits reach the workshops.\n\nThe Workers' Autonomous Federation wants to choose its own representatives. Recognition brings an organization outside the existing union appointments into negotiations; rejection will not simply send those workers home."
 ctc_china_may.5.a:0 "Recognize their representatives and receive labor demands."
 ctc_china_may.5.b:0 "Use existing unions; refuse recognition of autonomous bodies."
 ctc_china_may.6.t:0 "The Martial Law Decision"
 ctc_china_may.6.desc:0 "Divisions in the central leadership have become public. Advocates of martial law demand troops; opponents fear that once the military enters Beijing, political questions can no longer be resolved in meeting rooms alone.\n\nThe State Council, Central Military Commission and Beijing authorities need a clear decision. Earlier replies to students and workers lie on the table."
 ctc_china_may.6.a:0 "Approve martial law in parts of Beijing."
 ctc_china_may.6.b:0 "Reject martial law and authorize reformist negotiations."
 ctc_china_may.6.c:0 "Convene joint talks including worker representatives."
 ctc_china_may.7.t:0 "Order in the City"
 ctc_china_may.7.desc:0 "[CTCMayCityContext]\n\nStudent representative bodies have changed repeatedly, while workers' organizations continue to grow. New arrangements require people able to implement them in the streets and workplaces."
 ctc_china_may.7.a:0 "Let negotiators jointly oversee withdrawal and classes."
 ctc_china_may.7.b:0 "Let workers elect shop-floor representatives for restart talks."
 ctc_china_may.7.c:0 "Keep troops outside the city under martial law orders."
 ctc_china_may.7.d:0 "Support worker pickets opposing the troops' entry."
 ctc_china_may.8.t:0 "The Last Mediation"
 ctc_china_may.8.desc:0 "Some in the square insist on staying, some favor withdrawal, and many wait for an answer they can trust. A written decision has not ended disputes within government either.\n\nThis proposal must specify who implements it and who oversees it. If talks fail again, advocates of compromise will struggle to keep the parties at the table."
 ctc_china_may.8.a:0 "Sign a reform agenda and accept public oversight."
 ctc_china_may.8.b:0 "Support the strikers' labor rights agreement."
 ctc_china_may.8.c:0 "Admit soldiers opposing force into joint action."
 ctc_china_may.8.d:0 "End mediation and hand matters to martial law command."
 ctc_china_may.9.t:0 "June's Choice"
 ctc_china_may.9.desc:0 "The final orders await signature. Martial law advocates demand immediate control of the capital; negotiators bring their respective answers and wait for the center to keep its promises.\n\nThe signatures, refusals and deployment orders of recent weeks will not vanish. Tonight's decision will bring the crisis toward its conclusion."
 ctc_china_may.9.a:0 "Order troops into the city and forcibly end the movement."
 ctc_china_may.9.b:0 "Implement the agreement and publish a political reform timetable."
 ctc_china_may.9.c:0 "Accept the labor accord and resolve the crisis through strike talks."
 ctc_china_may.9.d:0 "Form a revolutionary committee with workers and supporting troops."
 ctc_china_may.10.t:0 "The First Replies"
 ctc_china_may.10.desc:0 "The material received in April now needs answers. Reviews, newspapers, education and assembly rules involve different agencies; promised measures must have named responsibilities.\n\nMatters on which no promise was made also deserve reasons. Whether the government puts its replies in writing will set the starting point for further dialogue."
 ctc_china_may.10.a:0 "Publish replies and the first implementation list."
 ctc_china_may.10.b:0 "Explain progress and continue existing procedures."
 ctc_china_may.10.c:0 "Stop answering additional demands."
 ctc_china_may.10.d:0 "Implement all seven demands and publish the execution orders."
 ctc_china_may.11.t:0 "Who Can Negotiate?"
 ctc_china_may.11.desc:0 "Lists arriving from the universities do not entirely agree. Some delegates were elected on campus, some represent a single march, and others reject the existing delegation. The government also needs to identify who can give binding replies.\n\nWithout clear credentials, even a signed document may not bind later participants. Mandates must be verified before commitments can be recognized."
 ctc_china_may.11.a:0 "Accept autonomous representatives confirmed by their campuses."
 ctc_china_may.11.b:0 "Use only lists supplied by official organizations."
 ctc_china_may.11.c:0 "Jointly verify campus mandates before confirming delegates."
 ctc_china_may.12.t:0 "Who Holds Authority?"
 ctc_china_may.12.desc:0 "The hunger strike and solidarity actions widen the crisis, and divisions at the center can no longer be concealed. Further talks need an explicit mandate; preparations to use troops likewise need someone responsible for the decision.\n\nWhether Zhao Ziyang continues to lead negotiations must now be settled. Holding a title and holding effective authority are no longer the same thing."
 ctc_china_may.12.a:0 "Explicitly authorize Zhao Ziyang to lead negotiations."
 ctc_china_may.12.b:0 "Revoke his mandate and transfer authority to conservatives."
 ctc_china_may.12.c:0 "Coordinate collectively without individual signing authority."
 ctc_china_may.13.t:0 "Seats for Workers and Students"
 ctc_china_may.13.desc:0 "Workers bring wages, enterprise management and organizing rights to the meeting. Students retain their own mandates and agendas; they cannot decide for the workshops. Cooperation requires each side's confirmation, not a unified label imposed by government.\n\nJoint talks can coordinate action, while separate talks should still leave distinct, accountable commitments."
 ctc_china_may.13.a:0 "Accept a joint conference confirmed by both groups."
 ctc_china_may.13.b:0 "Meet separately and record separate commitments."
 ctc_china_may.13.c:0 "Let only students pass on workers' views."
 ctc_china_may.14.t:0 "A Reply from the Troops"
 ctc_china_may.14.desc:0 "Officers supporting joint action submit a written reply. They are willing to oppose force publicly, but demand a common command specifying where supplies come from and to whom troops answer.\n\nThis goes beyond individual refusal of orders. Accepting these conditions means accepting a rival military command; asking only for a pause still leaves a final opening for negotiation."
 ctc_china_may.14.a:0 "Accept joint command and publicly welcome supporting troops."
 ctc_china_may.14.b:0 "Request a pause and continue seeking negotiation."
 ctc_china_may.15.t:0 "Returning the Agreement to Representatives"
 ctc_china_may.15.desc:0 "A text has emerged from the talks, but signatories must answer to the organizations that chose them. The clauses, oversight arrangements and first implementation dates need explanation.\n\nRatification by the relevant organizations makes the agreement binding. Bypassing that process may leave signatures representing only their signers."
 ctc_china_may.15.a:0 "Accept the organizations' ratification and publish the agreement."
 ctc_china_may.15.b:0 "Stop waiting for ratification; retain only the delegates' signatures."
 ctc_china_may.16.t:0 "The First Implementation Stage"
 ctc_china_may.16.desc:0 "The agreement has been ratified, and its first provisions enter implementation. Procedures, monitors and departmental responsibilities have been listed. The question is now whether the government acts as agreed.\n\nDelay will cost the representatives support. Implementation also carries costs: existing arrangements must give way and agencies must accept new oversight."
 ctc_china_may.16.a:0 "Implement the first stage and publish its results."
 ctc_china_may.16.b:0 "Withhold implementation and retain existing practices."
 ctc_china_may.17.t:0 "Gunfire in the City"
 ctc_china_may.17.desc:0 "Troops carry out orders to enter the city. Reports arrive of gunfire and casualties. Hospitals receive the wounded, families search for relatives, and incomplete reports continue reaching command.\n\nOrders have become irreversible events. Beyond demands for order, someone must take responsibility for verifying casualties and treating the injured."
 ctc_china_may.17.a:0 "Organize treatment and require casualty verification."
 ctc_china_may.17.b:0 "Collect unit reports and continue the existing response."
 ctc_china_may.18.t:0 "Changes in the Central Leadership"
 ctc_china_may.18.desc:0 "A Central Committee plenum changes the leadership. Zhao Ziyang loses his party leadership posts, and Jiang Zemin is elected general secretary. Authority that shifted during the crisis is now formalized in personnel decisions.\n\nThe new leadership inherits unfinished investigations, rectification and economic work. June's unresolved questions enter their next stage."
 ctc_china_may.18.a:0 "Publish the leadership decision."
 ctc_china_may.19.t:0 "The Published Response"
 ctc_china_may.19.desc:0 "Review findings and orders revoking punishments have been issued. The first asset declarations are public, and newspaper registrations are being accepted. Education funds reach schools, while new assembly rules and petition materials appear in print. Departments deliver stamped implementation documents to the delegation.\n\nCampus representatives check the response and agree to accept it, arrange withdrawal and resumed classes, and retain liaison bodies to monitor compliance. The decision now is whether this effective agreement should end the crisis."
 ctc_china_may.19.a:0 "Accept the delegation's decision and implement the agreement."
 ctc_china_may.19.b:0 "Withhold confirmation and continue consultations."
 ctc_china_may.20.t:0 "The Beijing Summit"
 ctc_china_may.20.desc:0 "Gorbachev arrives in Beijing. The stalled Sino-Soviet summit finally takes place, with leaders discussing normalization, borders, trade and regional affairs.\n\nThe delegation drives toward the venue along reopened Chang'an Avenue. The domestic agreement has reached a settlement, allowing diplomats to proceed with the planned talks."
 ctc_china_may.20.a:0 "Begin the talks."
