l_english:
 CTC_START_SOV_DESC:0 "Reforms from the Union center must pass through republican and enterprise accounts. Miners demand better lives and local authorities seek more power, while production and supply still bind the republics together."
 CTC_START_USA_DESC:0 "The federal budget needs congressional support, and states await grants. Industrial workers watch orders and jobs, while overseas forces and allied costs enter the new year's agenda."
 CTC_START_WGR_DESC:0 "Exporters need steady orders and unions demand a share of growth. The federal government, the states and the Germany to the east face both institutional boundaries and increasingly unavoidable common questions."
 CTC_START_DDR_DESC:0 "Factories still fulfill plans, but residents focus increasingly on shop supplies and opportunities to leave. News of reform crosses the border, and the party must decide how far change should go."
 CTC_START_ENG_DESC:0 "Privatization has changed enterprises and local finances without ending the debate. Housing, public services and industrial employment confront the government alongside new demands from European cooperation."
 CTC_START_FRA_DESC:0 "President, parliament and local governments each have promises to keep. Public services need funds and firms need investment; European cooperation gives formerly domestic disputes a new scale."
 CTC_START_JAP_DESC:0 "Enterprises expand investment as land and asset prices attract more money. Exports bring income and trade friction, while local life, urban transport and public services still need sustained investment."
 CTC_START_ITA_DESC:0 "The coalition must preserve parliamentary support while managing the gap between public spending and regional development. One budget cannot easily satisfy businesses, local institutions and unions together."
 CTC_START_POL_DESC:0 "Supply shortages and enterprise debts fill the government's desk, while workers' organizations demand a say. Old management methods are failing; public acceptance of new arrangements will determine how reform begins."
 CTC_START_SPR_DESC:0 "Industrial adjustment brings new orders but removes familiar jobs in some regions. The center and autonomous communities must share public investment duties, while European markets offer opportunities and competition."
 CTC_START_YUG_DESC:0 "Republics dispute budgets, debts and powers, while a common market and military still bind them together. Federal institutions need arrangements that local communities will accept."
 CTC_START_CAN_DESC:0 "Foreign trade affects manufacturing and resource regions differently, and provincial demands on federal policy diverge. The government must build support across spending, regional interests and relations with its neighbor."
 CTC_START_AST_DESC:0 "Industrial adjustment and foreign trade are changing employment. The federation, states and unions must negotiate incomes and public services, while remote transport and infrastructure need lasting plans."
 CTC_START_RAJ_DESC:0 "A vast public sector, rural needs and state finances confront the center together. Industry and research have ambitions, but infrastructure gaps and regional differences obstruct each plan in different ways."
 CTC_START_PAK_DESC:0 "The civilian government needs parliamentary and local support while managing the military's established influence. Regional affairs, foreign aid and domestic finances are intertwined; public services cannot wait indefinitely for crises to end."
 CTC_START_KOR_DESC:0 "Export industry continues to grow as workers and urban residents make firmer political and social demands. Government, business and civic organizations must renegotiate the distribution of growth and decision-making power."
 CTC_START_PRK_DESC:0 "Planned production depends on energy and material allocation, with defense spending holding a major place. Sustaining urban supplies, equipment and external contacts requires choices within the established system."
 CTC_START_CHI_DESC:0 "Political opening brings new participants, while exporters and local communities have their own demands. Industrial investment, public services and cross-strait relations need answers within changing institutions."
 CTC_START_VIN_DESC:0 "Economic renovation is changing enterprises and villages, but transport, equipment and everyday supplies remain short. Better foreign relations and restored production require commitments from both central and local authorities."
 CTC_START_INS_DESC:0 "Central investment plans span the archipelago, but local needs differ. Resource income, factory orders and food supplies shape everyday life and test administrative capacity."
 CTC_START_SIA_DESC:0 "Exports and urban investment bring growth, while rural and border regions demand more public services. Arrangements among parliament, the military and local forces will shape how far policy can go."
 CTC_START_PER_DESC:0 "War has left factories, roads and families needing reconstruction. The government must divide scarce revenues, resettle veterans and decide how to restore economic ties with the outside world."
 CTC_START_IRQ_DESC:0 "Reconstruction needs funds, while debts and the costs of a vast military remain. Production, resettlement and relations with neighbors will together shape the country's direction."
 CTC_START_TUR_DESC:0 "Market reform and urban expansion are changing jobs and incomes. The government faces public finances, regional disparities and security spending, alongside institutional questions raised by European relations."
 CTC_START_ISR_DESC:0 "Security policy and the Palestinian question continue to divide parliament and society. Housing, public spending and diplomatic talks continue, while factions disagree deeply over the country's direction."
 CTC_START_SAF_DESC:0 "Apartheid faces domestic resistance and outside pressure. Firms need markets and workers demand rights. Whether political arrangements change will also determine economic and public life."
 CTC_START_BRA_DESC:0 "New constitutional arrangements raise hopes, but inflation and debt keep eroding incomes. Federal, state and municipal governments must coordinate finances as society waits for promises to become services and jobs."
 CTC_START_ARG_DESC:0 "Inflation continually shifts wages and prices, while debt narrows fiscal choices. The government must face businesses, unions and provinces together and secure enough support for economic adjustment."
