l_simp_chinese:
 N89_BOOKMARK:0 "一九八九"
 N89_BOOKMARK_DESC:0 "冷战进入第四十个年头。莫斯科正试图改造苏联，柏林墙仍横贯欧洲；东亚的工厂与港口日夜运转，旧有秩序却已显出裂缝。\n\n在中国，改革走过了十年。增长改变了生活，物价、分配与权力的问题也随之浮现。去年秋天提出的治理整顿，如今必须落实到每一笔贷款、每一项投资和每一份工资上。"
 N89_COUNTRY_DESC:0 "经济仍在增长，许多人的日子却过得更紧了。治理整顿、廉政建设和对外关系同时摆在中央面前；不同的改革主张，正在既有体制内争取各自的空间。"
 N89_GOVERNMENT:0 "赵紫阳"
 N89_GOVERNMENT_DESC:0 "中国共产党中央委员会总书记。国务院由李鹏主持，重大决策仍受中央元老及党内不同主张的影响。"
 n89_credit_restraint:0 "紧缩调整的建设代价"
 n89_credit_restraint_desc:0 "部分在建项目暂停，新的贷款审批收紧。过热的投资逐步降温，施工单位和地方政府也开始承受调整的代价。"
 N89_PRC_opening:0 "改革十年之后"
 N89_PRC_opening_desc:0 "十年前，新的政策让农民、工人和企业看到了变化的可能。如今，城市商店里的价格不断上调，地方争相上马的项目仍在等待贷款。中央已经提出治理整顿，新年伊始，各部门首先要回答一个具体问题：哪些事必须继续，哪些事应当停下来。"
 N89_PRC_adjustment:0 "落实治理整顿"
 N89_PRC_adjustment_desc:0 "压缩投资、稳定市场、保障生产，文件上的几项任务到了地方，往往争用同一笔资金。治理整顿需要排出先后次序。只有把各部门的计划放在一起核对，中央的决定才能落到实处。"
 N89_PRC_prices:0 "压缩过热投资"
 N89_PRC_prices_desc:0 "工地需要钢材和水泥，企业需要贷款，地方希望新项目尽快投产。不断扩张的投资正在挤占原材料与信贷。先停下非重点项目，可以缓和供求紧张；已经投入的资金和等待开工的职工，则必须另作安排。"
 N89_PRC_employment:0 "保障重点生产"
 N89_PRC_employment_desc:0 "有些厂房应当缓建，有些生产线一天也停不得。能源、运输和重要工业部门需要稳定的周转资金，否则投资压缩的影响很快就会传到工资与供应上。应当先核清这些企业的实际需要，再决定拨款。"
 N89_PRC_supply:0 "保障基本供应"
 N89_PRC_supply_desc:0 "居民看到的是柜台上的价签，供应部门看到的是仓库、铁路和购销计划。粮油、肉类和日用品的货源需要逐项核对。把运输和调拨环节理顺，才能让有限的物资及时进入市场。"
 N89_PRC_rural:0 "保障春耕投入"
 N89_PRC_rural_desc:0 "春耕不会等预算慢慢落实。化肥、农药和农用柴油若误了农时，后果要到秋天才会显现。农业部门应当会同供销和运输系统，先把生产资料送到需要它们的地方。"
 N89_PRC_political:0 "整顿行政与廉政工作"
 N89_PRC_political_desc:0 "财经问题查到最后，常常涉及审批权、人情和部门利益。整顿不能只要求企业与居民作出让步。机关的支出、干部的责任和行政程序，同样需要接受检查。"
 N89_PRC_discipline:0 "执行财经纪律"
 N89_PRC_discipline_desc:0 "一项工程可能同时占着几处贷款，一笔预算也可能早已改了用途。审计和财政部门应当核对账目，追查越权审批与挪用资金。报告必须说明钱去了哪里，以及由谁负责。"
 N89_PRC_oversight:0 "准备行政诉讼法施行"
 N89_PRC_oversight_desc:0 "行政诉讼法已经通过，施行日期定在明年十月一日。法院需要熟悉新的受案范围，行政机关也要整理程序与案卷。在法律真正进入日常生活以前，还有许多准备工作要做。"
 N89_PRC_voices:0 "整理群众来信与基层意见"
 N89_PRC_voices_desc:0 "来信谈到住房、物价、干部作风，也谈到拖了数年仍未答复的事情。分散在各部门的材料很难显出全貌。将这些意见汇总起来，至少能让决策者看清哪些问题正在反复出现。"
 N89_PRC_channels:0 "建立危机协商渠道"
 N89_PRC_channels_desc:0 "街头的要求已经不能靠层层转报来回应。政府需要派出有权答复问题的人，说明哪些事项可以讨论，哪些决定仍需请示。对方是否接受这样的安排，还要由他们自己决定。"
 N89_PRC_education:0 "落实年度教育投入"
 N89_PRC_education_desc:0 "政府工作报告再次提出发展教育。学校需要的却不只是报告中的表述：教师待遇、教学设备和办学经费都要落实到预算。先核查拨款是否到位，再处理各地积压的困难。"
 N89_PRC_budget:0 "压缩非必要行政支出"
 N89_PRC_budget_desc:0 "会议、招待、车辆和楼堂馆所，各有各的开支理由。财政紧张时，机关不能置身事外。逐项压减非必要支出，既能腾出资金，也能为其他部门的整顿立下规矩。"
 N89_PRC_summit:0 "筹备中苏高级会晤"
 N89_PRC_summit_desc:0 "中苏关系正常化已经进入关键阶段。边境、地区局势和访问安排都需要细致准备。高级会晤能否顺利举行，取决于此前数月不引人注目的磋商与协调。"
 N89_PRC_contacts:0 "保持对外经济联络"
 N89_PRC_contacts_desc:0 "对外开放仍是既定方针，国内调整也使许多合作项目需要重新核算。保持与外方的工作联系，解释政策变化，逐项处理投资和贸易中的实际问题，可以减少不必要的疑虑。"
 N89_PRC_review:0 "第一季度政策复核"
 N89_PRC_review_desc:0 "第一季度将尽，各部门的执行报告陆续送来。哪些项目已经停建，哪些供应仍在吃紧，哪些拨款只停留在纸面上，都应重新核对。下一步的工作不能只依据年初的计划。"
 n89_china.1.t:0 "新年案头"
 n89_china.1.d:0 "一九八九年的第一批文件送到了案头。去年的价格闯关和抢购风潮仍令人记忆犹新，治理整顿已经成为各部门必须落实的任务。\n\n改革带来的变化随处可见，积累的矛盾也越来越难以回避。企业盼贷款，居民关心菜价，知识界讨论权力与改革。中央还要为即将到来的中苏高级会晤和美国新总统访华作准备。\n\n这一年的工作，从这些具体而繁杂的事情开始。"
 n89_china.1.a:0 "把各部门的安排拿来。"
 n89_china.10.t:0 "一封公开信"
 n89_china.10.d:0 "一月六日，方励之致信邓小平，提出特赦包括魏京生在内的政治犯。改革已经进行了十年，对经济变化的讨论，也在不断引出对政治生活的追问。\n\n这封信使知识界的一部分诉求更加公开。有关部门需要整理它所提出的问题，以及陆续出现的意见。"
 n89_china.10.a:0 "将信件转交有关部门。"
 n89_china.10.b:0 "把相关意见一并汇总。"
 n89_china.11.t:0 "会晤之前"
 n89_china.11.d:0 "二月四日，邓小平在上海会见苏联外长谢瓦尔德纳泽。中苏两国长达数十年的关系曲折，如今有了走向正常化的机会。\n\n高级会晤的准备还要继续。外交部门需要与各有关部门协调议题和接待安排，既定工作之外，又添了几份必须尽快办妥的文件。"
 n89_china.11.a:0 "按既定安排继续筹备。"
 n89_china.11.b:0 "调集人手，加紧协调。"
 n89_china.12.t:0 "布什抵京"
 n89_china.12.d:0 "二月二十五日，美国总统乔治·布什抵达北京。对于这位曾在中国工作过的新总统，北京并不陌生；对于中国领导人，这次访问则是与美国新政府建立工作关系的重要机会。\n\n接待、会谈和有关部门的准备工作已经排定。双方仍有分歧，需要讨论的事情也很多。"
 n89_china.12.a:0 "按计划安排会谈。"
 n89_china.24.t:0 "会谈之后"
 n89_china.24.d:0 "二月二十六日，赵紫阳与布什举行会谈。对外关系与国内改革同时摆在面前，双方需要保持联系，把会谈涉及的事项交由有关部门继续处理。\n\n既定外交日程仍在推进。赵紫阳计划于四月下旬访问朝鲜，这项安排也已进入筹备。"
 n89_china.24.a:0 "整理记录，分送有关部门。"
 n89_china.13.t:0 "去年的账"
 n89_china.13.d:0 "国家统计局公布了上一年的统计公报。生产仍在增长，供求失衡和物价上涨也清楚地反映在数字中。增长带来的成绩，与居民和企业承受的压力，出现在同一份报告里。\n\n年初的计划需要据此重新核对。投资压缩到什么程度，重点生产与市场供应又能得到多少保障，都需要更具体的答案。"
 n89_china.13.a:0 "重新核对投资与供应计划。"
 n89_china.13.b:0 "先查重点商品的供应。"
 n89_china.14.t:0 "治理与整顿"
 n89_china.14.d:0 "三月二十日，李鹏向七届全国人大二次会议作政府工作报告。治理经济环境、整顿经济秩序和全面深化改革，构成了这一年的工作主线。\n\n报告涉及投资、生产、农业与教育等许多方面。各部门接下来要做的，是将年度任务分解到预算和执行计划中。"
 n89_china.14.a:0 "各部门据此落实年度工作。"
 n89_china.14.b:0 "要求同时报送基层执行情况。"
 n89_china.15.t:0 "行政诉讼法"
 n89_china.15.d:0 "四月四日，七届全国人大二次会议通过《中华人民共和国行政诉讼法》。公民、法人和其他组织对具体行政行为提起诉讼，将有一部专门的法律作为依据。\n\n新法定于一九九〇年十月一日起施行。法律文本已经通过，法院和行政机关的准备工作现在才刚刚开始。"
 n89_china.15.a:0 "着手准备施行。"
 n89_china.16.t:0 "胡耀邦逝世"
 n89_china.16.d:0 "四月十五日，胡耀邦在北京逝世。消息传开后，悼念的人群开始聚集。对这位前总书记的追思，也带出了人们对过去数年政治生活的回忆。\n\n悼念活动如何安排，群众递交的意见由谁接收，这些事务很快需要中央与北京市作出回应。"
 n89_china.16.a:0 "安排悼念，也安排接收意见的人。"
 n89_china.16.b:0 "依照既定规格办理。"
 n89_china.17.t:0 "递交的要求"
 n89_china.17.d:0 "学生向全国人大方面递交请愿，提出重新评价胡耀邦、公布干部及家属收入、改善教育待遇，以及新闻出版等方面的要求。随着参与者增多，请愿的内容也在不断变化。\n\n材料到了政府手中，答复却不能只是一张收条。谁出面接洽、哪些问题可以讨论、何时给出回应，都将影响下一步的发展。"
 n89_china.17.a:0 "正式收件，安排分项答复"
 n89_china.17.b:0 "只接收悼念事项"
 n89_china.17.c:0 "收件，暂不承诺答复期限"
 n89_china.18.t:0 "大会堂前"
 n89_china.18.d:0 "四月二十二日，胡耀邦追悼会举行。人民大会堂前，三名学生跪呈请愿，希望有官员出面接见。\n\n广场上等待答复的人越来越多。出面接洽的人是否有权作出承诺，政府接下来的安排能否传达清楚，已不再是可以留给一般转办程序的事情。"
 n89_china.18.a:0 "安排有授权的代表接收请愿"
 n89_china.18.b:0 "接收书面材料，不承诺现场会面"
 n89_china.18.c:0 "不安排官员在现场接见"
 n89_china.19.t:0 "原定的行程"
 n89_china.19.d:0 "四月二十三日，原定的访朝日期到了。外交行程已筹备多时，北京的局势却仍在发展。\n\n赵紫阳是否按期出访，需要作出决定。无论行程怎样安排，留京领导人之间的分工、对学生诉求的判断，以及谁有权继续接洽，都必须交代清楚。"
 n89_china.19.a:0 "推迟访问，留京协调"
 n89_china.19.b:0 "按期出访，维持既有中央分工"
 n89_china.19.c:0 "按期出访，由保守派主导处置。"
 n89_china.20.t:0 "社论待发"
 n89_china.20.d:0 "围绕学潮的判断，中央内部仍有分歧。一份即将发表的社论，可能把这些判断变成全国各地据以行动的正式口径。\n\n保守派要求明确事态的严重性，迅速恢复秩序；主张对话的人担心，过于严厉的定性会使接洽更加困难。措辞一旦见报，就很难再当作内部讨论收回。"
 n89_china.20.a:0 "发表强硬定性的社论"
 n89_china.20.b:0 "改为承认诉求、呼吁对话"
 n89_china.20.c:0 "暂缓社论，继续协调答复安排"
 n89_china.21.t:0 "走上街头"
 n89_china.21.d:0 "四月二十七日，学生走上北京街头，反对前一天社论对运动的定性。游行沿途吸引了许多市民围观，政府面对的局面比几天前更加复杂。\n\n现场执勤人员需要明确的指示。是让队伍通过、尝试接洽，还是进一步限制行动，决定必须尽快传达下去。"
 n89_china.21.a:0 "允许游行，并接洽代表"
 n89_china.21.b:0 "现场避让，暂不升级处置"
 n89_china.21.c:0 "增加限制，拒绝接洽"
 n89_china.22.t:0 "坐到桌前"
 n89_china.22.d:0 "对话的安排提上日程，但能否真正谈下去，还取决于代表如何产生、哪些事项可以列入议程，以及答复是否具有实际效力。\n\n此前留下的接洽渠道，现在终于要面对这些问题。见面只是开始；双方都在等对方拿出可以相信的行动。"
 n89_china.22.a:0 "共同商定代表与议程"
 n89_china.22.b:0 "按政府确定的议程接洽"
 n89_china.22.c:0 "延期，先公布需要核实的事项"
 n89_china.23.t:0 "四月将尽"
 n89_china.23.d:0 "四月的最后一天，案头的文件已经与年初很不相同。经济工作仍要继续，街头与校园的问题却要求更直接的回答。已经作出的承诺、发表的意见和未获答复的诉求，都将留到下个月。\n\n改革派影响：[?n89_r|0]　保守派影响：[?n89_h|0]\n沟通信任：[?n89_trust|0]"
 n89_china.23.a:0 "把这些问题留在议程上。"
 n89_china.30.t:0 "协调意见"
 n89_china.30.d:0 "各方对于局势的判断尚未一致，执行部门却已经在等待指示。继续协商需要明确的授权，统一处置也需要说服不同意见的人。\n\n这次协调能够取得多少进展，取决于党内支持是否足够。至少，工作层的联络不应在争论中断掉。"
 n89_china.30.a:0 "争取协商授权的支持"
 n89_china.30.b:0 "强调统一执行"
 n89_china.30.c:0 "接受分歧，保留工作层联络"
 n89_governance:0 "中央工作简报"
 n89_governance_desc:0 "治理整顿已经部署。供应、教育拨款和财经纪律的执行情况仍需逐项核查；工厂与基层单位的意见，也在等待答复。"
 n89_supply_decision:0 "追加生活必需品供应"
 n89_supply_decision_desc:0 "核查库存和运输，追加生活必需品调拨。\n\n稳定度 +1%。三十天后可再次安排。"
 n89_education_budget:0 "检查年度教育拨款执行"
 n89_education_budget_desc:0 "年度教育工作已经部署，拨款是否到位仍须逐项核查。\n\n沟通信任 +2。本季度限一次。"
 n89_audit:0 "开展财经纪律核查"
 n89_audit_desc:0 "核对各部门资金使用情况，对挪用和越权支出作出处理。\n\n沟通信任 +2。本季度限一次。"
 n89_worker_contact:0 "经既有工会汇总职工意见"
 n89_worker_contact_desc:0 "通过现有工会收集工资、福利与生产方面的意见，交有关部门办理。\n\n沟通信任 +2。本季度限一次。"
 n89_coordination:0 "安排危机中的党内协调"
 n89_coordination_desc:0 "召集有关人员协调危机处置，明确接洽和执行权限。\n\n四十五天内不再安排同类协调。若只能维持工作联络，退回10政治点数。"
 n89_r:0 "改革派影响"
 n89_h:0 "保守派影响"
 n89_trust:0 "沟通信任"
 n89_initialized:0 "本季度治理工作已开始"
 n89_prototype_complete:0 "四月底阶段记录已完成"
 n89_annual_report_presented:0 "年度政府工作报告已提交"
 n89_admin_law_passed:0 "行政诉讼法已获通过"
 n89_admin_law_prepared:0 "行政诉讼法施行准备已开展"
 n89_channels:0 "危机协商渠道已建立"
 n89_listening:0 "基层意见已整理"
 n89_summit_prepared:0 "中苏会晤准备已开展"
 n89_statistics_released:0 "1988 年统计公报已发布"
