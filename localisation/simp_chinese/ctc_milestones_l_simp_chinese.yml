l_simp_chinese:
 CTC_PRC_crisis:0 "危机来临"
 CTC_PRC_crisis_desc:0 "胡耀邦逝世的消息传来，悼念的人群开始聚集。花圈和挽联之间，对腐败、物价与政治改革的议论也渐渐多了起来。中央必须面对的，已经不只是一次悼念活动。\n\n§L随现有民运开始事件自动完成。不能手动开始。§!"
 CTC_PRC_crisis_condition:0 "随现有民运开始事件自动完成。"
 CTC_PRC_stability:0 "稳定至上"
 CTC_PRC_stability_desc:0 "军队执行了镇压命令，政治中心重新控制了街头。交通恢复，机关照常办公；伤亡、清查与未获答复的诉求，却不会随着秩序恢复而消失。保守派已经决定了危机的处理方式，此后的政治生活将承受这一决定的后果。\n\n§L保守派镇压结局发生，并在结局事件中确认后完成。不能手动开始。§!"
 CTC_PRC_stability_condition:0 "保守派镇压结局发生，并在结局事件中确认后完成。"
 ctc_china_outcome.1.t:0 "稳定至上"
 ctc_china_outcome.1.d:0 "军队执行了镇压命令，政治中心重新控制了街头。交通恢复，机关照常办公；伤亡、清查与未获答复的诉求，却不会随着秩序恢复而消失。保守派已经决定了危机的处理方式，此后的政治生活将承受这一决定的后果。"
 ctc_china_outcome.1.a:0 "恢复各项工作。"
 CTC_PRC_democracy:0 "民主万岁"
 CTC_PRC_democracy_desc:0 "政治改革协议已经开始执行。公开讨论、权力监督与政治参与不再只是谈判桌上的要求，而要成为人人可以援引的制度。改革派赢得了这场争论，接下来的考验是让承诺经得起日常政治的检验。\n\n§L改革派改革结局发生，并在结局事件中确认后完成。不能手动开始。§!"
 CTC_PRC_democracy_condition:0 "改革派改革结局发生，并在结局事件中确认后完成。"
 ctc_china_outcome.2.t:0 "民主万岁"
 ctc_china_outcome.2.d:0 "政治改革协议已经开始执行。公开讨论、权力监督与政治参与不再只是谈判桌上的要求，而要成为人人可以援引的制度。改革派赢得了这场争论，接下来的考验是让承诺经得起日常政治的检验。"
 ctc_china_outcome.2.a:0 "让协议付诸实行。"
 CTC_PRC_workers_equality:0 "工人平等"
 CTC_PRC_workers_equality_desc:0 "罢工迫使谈判各方重新讨论工厂里的权利。工资分配、劳动保障与职工代表的地位被写入协约，工自联的诉求取得了可以执行的保障。工人将返回岗位，也将保留为这些权利再次组织起来的能力。\n\n§L工自联罢工促成左翼改良结局，并在结局事件中确认后完成。不能手动开始。§!"
 CTC_PRC_workers_equality_condition:0 "工自联罢工促成左翼改良结局，并在结局事件中确认后完成。"
 ctc_china_outcome.3.t:0 "工人平等"
 ctc_china_outcome.3.d:0 "罢工迫使谈判各方重新讨论工厂里的权利。工资分配、劳动保障与职工代表的地位被写入协约，工自联的诉求取得了可以执行的保障。工人将返回岗位，也将保留为这些权利再次组织起来的能力。"
 ctc_china_outcome.3.a:0 "按协约保障工人的权利。"
 CTC_PRC_second_revolution:0 "二次革命"
 CTC_PRC_second_revolution_desc:0 "工自联的革命纲领已经获得支持，斗争开始围绕政权归属展开。旧有机关与革命组织都在争取军队、工厂和地方的服从。谈判桌上没有解决的分歧，如今被带进了一场胜负未定的革命。\n\n§L工自联革命结局发生，并在结局事件中确认后完成。不能手动开始。§!"
 CTC_PRC_second_revolution_condition:0 "工自联革命结局发生，并在结局事件中确认后完成。"
 ctc_china_outcome.4.t:0 "二次革命"
 ctc_china_outcome.4.d:0 "工自联的革命纲领已经获得支持，斗争开始围绕政权归属展开。旧有机关与革命组织都在争取军队、工厂和地方的服从。谈判桌上没有解决的分歧，如今被带进了一场胜负未定的革命。"
 ctc_china_outcome.4.a:0 "革命已经开始。"
 CTC_PRC_worker_student_alliance:0 "工学联合"
 CTC_PRC_worker_student_alliance_desc:0 "革命取得胜利，工人和学生代表决定把战时合作写入新的政治安排。议会、选举与劳工保障成为重建的依据，革命组织也须接受自己确立的程序。联合政府的任务，是把共同反对旧秩序的人留在同一套制度之中。\n\n§L革命胜利后，在战后政治安排事件中选择社会民主路线。不能手动开始。§!"
 CTC_PRC_worker_student_alliance_condition:0 "革命胜利后，在战后政治安排事件中选择社会民主路线。"
 CTC_PRC_continuing_revolution:0 "继续革命"
 CTC_PRC_continuing_revolution_desc:0 "革命胜利没有使内部争论停止。毛派认为，新的权力机关同样可能脱离群众，因此要求把继续革命确立为政治生活的原则。群众动员与政治斗争将延续下去，战后的制度也将依照这一主张重新安排。\n\n§L革命胜利后，在战后政治安排事件中选择毛派路线。不能手动开始。§!"
 CTC_PRC_continuing_revolution_condition:0 "革命胜利后，在战后政治安排事件中选择毛派路线。"
 ctc_china_outcome.5.t:0 "胜利之后"
 ctc_china_outcome.5.d:0 "革命取得胜利，共同的敌人已经退场，战时联盟内部的分歧却随之显露。\n\n工学联合的支持者要求以选举、议会和劳工保障建立社会民主制度；毛派则主张继续发动群众，防止新的权力机关走上旧路。战后政府必须对这两套主张作出选择。"
 ctc_china_outcome.5.a:0 "实行工学联合的社会民主纲领。"
 ctc_china_outcome.5.b:0 "确立继续革命的毛派纲领。"
