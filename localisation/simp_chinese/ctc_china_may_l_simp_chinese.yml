 CTC_MAY_EDITORIAL_HARD:0 "强硬社论仍未撤回，讲话与既有口径之间的差距，使政府的态度更难判断。"
 CTC_MAY_EDITORIAL_REVISED:0 "此前的定性已经调整，会谈安排能否落实，成了人们判断讲话分量的依据。"
 CTC_MAY_EDITORIAL_OPEN:0 "此前保留的对话余地能否变成具体安排，成了人们判断讲话分量的依据。"
 CTC_MAY_CITY_MARTIAL:0 "市民守在路口，阻止戒严部队推进。机关和工厂里也在议论中央的决定。铁路、公交、医院和粮店还要维持运转，停工或停运将使僵局扩展到更多地方。"
 CTC_MAY_CITY_LABOUR:0 "一些工厂已经停工，工人要求在复工前明确工资协商、代表资格和组织权。联席谈判必须回应这些条件，同时保证医院、供水和必要运输继续运行。"
 CTC_MAY_CITY_REFORM:0 "政府同意继续谈判，代表们开始讨论怎样安排撤离和复课。机关、学校和街道需要执行办法，也需要能够向双方说明情况的联络人。"
