l_simp_chinese:
 ctc_china_may.1.t:0 "五四讲话"
 ctc_china_may.1.desc:0 "游行队伍又走上了街头。赵紫阳在亚洲开发银行年会上谈到学生的爱国热情，主张在民主和法制的轨道上解决问题。\n\n[CTCMayEditorialContext]学生关心的仍是，已经递交的要求究竟由谁来谈，下一份答复何时能够见到。"
 ctc_china_may.1.a:0 "把对话安排公布出去。"
 ctc_china_may.1.b:0 "缓和公开讲话，暂不作新的承诺。"
 ctc_china_may.2.t:0 "绝食开始"
 ctc_china_may.2.desc:0 "广场上的学生宣布绝食，要求政府公开回应。担架、救护车和送水的人穿过聚集的人群，医院开始接收身体衰弱的学生。\n\n中苏高级会晤已近，广场仍坐满了人。医疗部门需要保证救护通行，接洽人员则在等待有关正式会谈的指示。"
 ctc_china_may.2.a:0 "保证救护畅通，同时派人接洽。"
 ctc_china_may.2.b:0 "安排救护；正式会谈须先结束绝食。"
 ctc_china_may.3.t:0 "中苏会晤"
 ctc_china_may.3.desc:0 "戈尔巴乔夫抵达北京。欢迎仪式改在机场举行，外交日程仍在进行，外国记者的镜头却不断转向广场。\n\n两国结束长期对立的会晤不能轻易中断。礼宾人员重新核对路线，谈判班子则继续准备双方的会谈。"
 ctc_china_may.3.a:0 "按调整后的日程接待。"
 ctc_china_may.4.t:0 "镜头前的会面"
 ctc_china_may.4.desc:0 "李鹏与学生代表坐到了同一张桌前。电视把会面的片段送进千家万户，双方对结束绝食、对话资格和运动定性的分歧却没有消失。\n\n只有一场会面还不够。是否留下继续谈判的人员、议程和期限，将决定这张桌子明天还在不在。"
 ctc_china_may.4.a:0 "公布下一次会谈的日期与议程。"
 ctc_china_may.4.b:0 "先结束绝食，再讨论具体要求。"
 ctc_china_may.4.c:0 "下一次会谈让工人代表列席。"
 ctc_china_may.5.t:0 "工人的声音"
 ctc_china_may.5.desc:0 "工人自治组织开始在广场附近公开活动。他们带来的问题不只属于校园：工资追不上物价，厂长手里的权力越来越大，干部倒卖批条的传闻也传进了车间。\n\n工自联要求自己推选代表。承认他们，意味着让一个不由现有工会任命的组织进入谈判；拒绝他们，也不会让那些工人就此回到家中。"
 ctc_china_may.5.a:0 "承认代表资格，接收劳工诉求。"
 ctc_china_may.5.b:0 "由现有工会处理，不承认自治组织。"
 ctc_china_may.6.t:0 "戒严的决定"
 ctc_china_may.6.desc:0 "中央领导层已经发生公开分歧。主张戒严的人要求调动军队，反对者担心一旦部队进入北京，政治问题就再也无法只在会议室里解决。\n\n国务院、中央军委和北京市需要一份明确的决定。此前对学生和工人作出的答复，现在都摆在了会议桌上。"
 ctc_china_may.6.a:0 "批准在北京部分地区实行戒严。"
 ctc_china_may.6.b:0 "否决戒严，授权改革派继续谈判。"
 ctc_china_may.6.c:0 "召开包括工人代表在内的联席谈判。"
 ctc_china_may.7.t:0 "城市的秩序"
 ctc_china_may.7.desc:0 "[CTCMayCityContext]\n\n学生的代表机构几经变化，工人的组织仍在扩大。要让新的安排生效，必须有人能在街头和工作场所把它执行下去。"
 ctc_china_may.7.a:0 "由谈判代表共同监督撤离与复课。"
 ctc_china_may.7.b:0 "允许工人推选车间代表，协调复工条件。"
 ctc_china_may.7.c:0 "部队暂留城外，继续执行戒严命令。"
 ctc_china_may.7.d:0 "支持工人纠察队，反对部队进城。"
 ctc_china_may.8.t:0 "最后的斡旋"
 ctc_china_may.8.desc:0 "广场上仍有人坚持，有人主张撤离，更多的人在等待一句可以相信的答复。政府内部的争论也没有因一纸决定而结束。\n\n这次交出的方案必须写清谁来执行、谁能监督。倘若谈判再次破裂，支持妥协的人将很难再把各方留在桌前。"
 ctc_china_may.8.a:0 "签署改革议程，接受公开监督。"
 ctc_china_may.8.b:0 "支持罢工代表提出的劳动权利协约。"
 ctc_china_may.8.c:0 "接受反对武力处置的军人加入联合行动。"
 ctc_china_may.8.d:0 "结束斡旋，交由戒严指挥机关处理。"
 ctc_china_may.9.t:0 "六月的抉择"
 ctc_china_may.9.desc:0 "最后的命令等待签发。坚持戒严的人要求立即恢复对首都的控制；谈判代表则带着各自得到的答复，等待中央兑现承诺。\n\n过去几周留下的签字、拒绝和调令不会自行消失。今晚作出的决定，将把这场危机带向结局。"
 ctc_china_may.9.a:0 "命令部队进城，强制结束运动。"
 ctc_china_may.9.b:0 "执行改革协议，公布政治改革日程。"
 ctc_china_may.9.c:0 "接受劳动协约，以罢工谈判结束危机。"
 ctc_china_may.9.d:0 "由工人组织和响应部队组成革命委员会。"
 ctc_china_may.10.t:0 "首批答复"
 ctc_china_may.10.desc:0 "四月收下的材料，现在到了需要答复的时候。复查、报刊、教育和集会规则分别涉及不同部门，已经承诺的事项必须列明由谁负责。\n\n过去没有承诺的内容，也应当说明理由。政府是否肯把自己的答复写下来，将成为下一轮对话的起点。"
 ctc_china_may.10.a:0 "公布答复与首期执行清单。"
 ctc_china_may.10.b:0 "说明进度，继续按原有程序办理。"
 ctc_china_may.10.c:0 "不再答复新增要求。"
 ctc_china_may.10.d:0 "落实全部七项要求，公布决定与执行文书。"
 ctc_china_may.11.t:0 "谁能代表谈判"
 ctc_china_may.11.desc:0 "各校送来的名单并不完全一致。有人得到校内推选，有人只代表一次游行，还有人拒绝承认现有代表团的资格。政府同样需要明确哪些人可以作出有效答复。\n\n代表资格不清，即便签下文件，也未必约束后来加入的人。先核实授权，才能谈承诺如何得到承认。"
 ctc_china_may.11.a:0 "接受各校确认的自治代表。"
 ctc_china_may.11.b:0 "只按官方组织提供的名单接洽。"
 ctc_china_may.11.c:0 "共同核实各校授权，再确认名单。"
 ctc_china_may.12.t:0 "处置权交给谁"
 ctc_china_may.12.desc:0 "绝食和声援使危机不断扩大，中央内部的分歧也已无法掩饰。继续谈判需要明确授权，准备动用军队同样需要有人承担决定的责任。\n\n赵紫阳能否继续主持协商，现在必须作出结论。保留名义职务与保留实际处置权，不再是一回事。"
 ctc_china_may.12.a:0 "明确授权赵紫阳主持协商。"
 ctc_china_may.12.b:0 "撤销其处置授权，由保守派接管。"
 ctc_china_may.12.c:0 "暂由集体协调，不授予个人签约权。"
 ctc_china_may.13.t:0 "工人与学生的席位"
 ctc_china_may.13.desc:0 "工人代表把工资、企业管理和组织权带到了会场。学生代表仍有各自的授权和议程，不能替车间作决定。双方是否合作，需要各自确认，而不是由政府指定一个统一名义。\n\n共同谈判可以协调行动，分开谈判也应分别留下可以追究的承诺。"
 ctc_china_may.13.a:0 "接受双方确认的联合代表会议。"
 ctc_china_may.13.b:0 "分别接洽，分别记载承诺。"
 ctc_china_may.13.c:0 "只让学生转交工人的意见。"
 ctc_china_may.14.t:0 "来自部队的答复"
 ctc_china_may.14.desc:0 "支持联合行动的军官送来了一份书面答复。他们愿意公开反对强制处置，但要求建立共同指挥机构，说明补给从哪里来、部队向谁负责。\n\n这已超出个人拒绝执行命令的范围。接受这些条件，就要承担形成竞争性军事指挥的后果；仅要求暂缓推进，则仍保留最后的协商余地。"
 ctc_china_may.14.a:0 "接受共同指挥条件，公开接纳响应部队。"
 ctc_china_may.14.b:0 "只要求暂缓执行，继续寻求协商。"
 ctc_china_may.15.t:0 "把协议交回代表"
 ctc_china_may.15.desc:0 "谈判桌上形成了文本，但签字的人仍须向推选他们的组织交代。各项条款的含义、监督办法和第一期执行日期，需要重新说明。\n\n只有得到相关组织的追认，协议才能成为约束各方的依据。越过这个过程，签字可能只代表签字的人。"
 ctc_china_may.15.a:0 "接受各组织的确认结果，公布协议。"
 ctc_china_may.15.b:0 "不再等候确认，只保留代表的签字。"
 ctc_china_may.16.t:0 "第一期履约"
 ctc_china_may.16.desc:0 "协议已经得到确认，第一批条款开始进入执行阶段。受理办法、监督人员和部门分工都有了名单，接下来要看政府是否按约定办事。\n\n拖延会使代表失去支持。落实这些事项也要付出代价：已有的行政安排必须让位，相关机关须接受新的监督。"
 ctc_china_may.16.a:0 "按约定落实第一期事项，公开执行结果。"
 ctc_china_may.16.b:0 "暂不执行，仍按原有办法处置。"
 ctc_china_may.17.t:0 "市区的枪声"
 ctc_china_may.17.desc:0 "部队执行进城命令，市区传来开枪和人员伤亡的消息。医院接收伤者，家属四处寻找亲人，尚不完整的报告继续送到指挥机关。\n\n命令已经变成无法撤回的事实。维持秩序的要求之外，伤亡如何核实、伤者怎样得到救治，也必须有人承担责任。"
 ctc_china_may.17.a:0 "组织救治，要求逐项核实伤亡。"
 ctc_china_may.17.b:0 "由各单位报送情况，继续既定处置。"
 ctc_china_may.18.t:0 "中央领导调整"
 ctc_china_may.18.desc:0 "中央全会作出领导层调整。赵紫阳被撤销党内领导职务，江泽民当选中央委员会总书记。危机期间已经改变的处置权，如今成为正式的人事决定。\n\n新的领导集体接过尚未结束的清查、整顿与经济工作。六月留下的问题，将由此进入下一阶段。"
 ctc_china_may.18.a:0 "公布调整决定。"
 ctc_china_may.19.t:0 "公布的答复"
 ctc_china_may.19.desc:0 "复查结论与撤销处分的通知已经下达；首批财产申报向社会公开，办报登记开始受理。教育款项拨至学校，集会新规和请愿材料一同见报。各部门把盖章的执行文书交给了代表团。\n\n各校代表核对后，同意接受这份答复，安排撤离与复课，并保留监督履约的联络机构。此刻需要决定的，是不是以这份已经生效的协议结束危机。"
 ctc_china_may.19.a:0 "接受代表团的意见，执行协议。"
 ctc_china_may.19.b:0 "暂不确认协议，继续会商。"
 ctc_china_may.20.t:0 "北京的会晤"
 ctc_china_may.20.desc:0 "戈尔巴乔夫抵达北京。此前陷于停顿的中苏高级会晤终于成行，两国领导人将讨论关系正常化，以及边境、贸易和地区局势。\n\n代表团沿着重新恢复通行的长安街驶向会场。国内协议已告一段落，外交人员可以按原定安排展开会谈。"
 ctc_china_may.20.a:0 "开始会谈。"
