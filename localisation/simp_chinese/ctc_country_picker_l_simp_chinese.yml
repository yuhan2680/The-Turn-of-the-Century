l_simp_chinese:
 CTC_START_SOV_DESC:0 "联盟中央推动的改革，必须经过各共和国和企业的账本。矿工要求改善生活，地方要求更多权限，而跨共和国的生产与供应仍彼此相连。"
 CTC_START_USA_DESC:0 "联邦预算要在国会获得支持，州政府还等着拨款。产业工人关心订单与岗位，海外驻军与盟国的费用也摆在新一年的议程上。"
 CTC_START_WGR_DESC:0 "出口企业需要稳定的订单，工会要求分享增长所得。联邦政府、各州与东边的德国之间，既有制度的界限，也有越来越难回避的共同问题。"
 CTC_START_DDR_DESC:0 "工厂仍在完成计划，居民却越来越在意商店里的供应与出境的机会。改革的消息越过边界传来，党内也必须回答变化应当走到哪一步。"
 CTC_START_ENG_DESC:0 "私有化改变了企业和地方财政，留下的争论却没有结束。政府要处理住房、公共服务与产业地区的就业，也要面对欧洲合作带来的新要求。"
 CTC_START_FRA_DESC:0 "总统、议会和地方政府各有要履行的承诺。公共服务需要拨款，企业需要投资；欧洲合作的推进，则让原本属于国内的争论有了新的尺度。"
 CTC_START_JAP_DESC:0 "企业扩大投资，土地和资产价格不断吸引资金。出口带来收入，也带来贸易摩擦；地方生活、城市交通与公共服务仍需要长期投入。"
 CTC_START_ITA_DESC:0 "联合政府要维持议会支持，也要处理公共支出与地区发展之间的落差。企业、地方机构和工会提出的要求，很难用同一份预算全部满足。"
 CTC_START_POL_DESC:0 "物资供应和企业债务压在政府案头，工人组织要求参与决定。旧有的管理办法已难维持，新的安排能否获得社会接受，将决定改革如何开始。"
 CTC_START_SPR_DESC:0 "工业调整带来新的订单，也使一些地区失去熟悉的岗位。中央政府与自治地区要分担公共投资的责任，欧洲市场则带来机会和新的竞争。"
 CTC_START_YUG_DESC:0 "各共和国围绕预算、债务和权限争论不休，共同的市场与军队却仍把它们联系在一起。联邦机构需要找到能被地方接受的办法。"
 CTC_START_CAN_DESC:0 "对外贸易牵动制造业和资源产区，各省对联邦政策的要求并不一致。政府需要在公共支出、地区利益与邻国关系之间争取支持。"
 CTC_START_AST_DESC:0 "产业调整与对外贸易改变着就业。联邦政府、各州和工会要协商收入与公共服务，偏远地区的交通和基础设施同样需要长期安排。"
 CTC_START_RAJ_DESC:0 "庞大的公共部门、乡村需求和各邦财政同时摆在中央面前。工业和科研有自己的雄心，基础设施与地区差异却使每项计划都面临不同的阻力。"
 CTC_START_PAK_DESC:0 "文官政府要争取议会和地方支持，也要处理军方的既有影响。邻国局势、外援和国内财政紧密相连，公共服务不能一直等到危机结束。"
 CTC_START_KOR_DESC:0 "出口工业继续增长，工人和城市居民也提出更明确的政治与生活要求。政府、企业和社会组织必须重新商定，增长所得与决策权应当如何分配。"
 CTC_START_PRK_DESC:0 "计划生产依赖能源和物资调配，国防支出占据重要位置。维持城市供应、设备运转与对外联系，需要中央在既有制度内作出选择。"
 CTC_START_CHI_DESC:0 "政治开放带来了新的参与者，出口企业与地方社会也有各自的诉求。产业投资、公共服务与两岸关系，都需要在变化中的制度内寻找答案。"
 CTC_START_VIN_DESC:0 "经济革新正在改变企业和乡村的做法，但运输、设备和日常供应仍有缺口。改善对外关系与恢复生产，需要中央和地方共同履行承诺。"
 CTC_START_INS_DESC:0 "中央的投资计划跨越群岛，地方的需要却各不相同。资源收入、工厂订单与粮食供应关系着生活，也考验着行政机构的能力。"
 CTC_START_SIA_DESC:0 "出口和城市投资带来增长，乡村与边境地区仍要求更多公共服务。议会、军方和地方势力之间的安排，会影响政策能走多远。"
 CTC_START_PER_DESC:0 "战争留下的厂房、道路和家庭都需要重建。政府要分配有限的收入，安排退役人员，并决定如何恢复与外部世界的经济联系。"
 CTC_START_IRQ_DESC:0 "战后的重建需要资金，债务和庞大军队的开支也没有消失。恢复生产、安置人员与处理邻国关系，将共同影响国家接下来的方向。"
 CTC_START_TUR_DESC:0 "市场改革和城市扩张改变着就业与收入。政府要处理公共财政、地方差异与安全支出，也要面对欧洲关系带来的制度问题。"
 CTC_START_ISR_DESC:0 "安全政策与巴勒斯坦问题持续牵动议会和社会。住房、公共支出和外交谈判并未因此停下，各派对国家应走的方向仍有深刻分歧。"
 CTC_START_SAF_DESC:0 "种族隔离制度面临国内抗争与外部压力。企业需要市场，劳动者要求权利；政治安排能否改变，也决定着经济与公共生活的前景。"
 CTC_START_BRA_DESC:0 "新的宪政安排带来期望，通货膨胀和债务却持续侵蚀收入。联邦、各州和城市需要协调财政，社会也在等待承诺变成实际的服务与岗位。"
 CTC_START_ARG_DESC:0 "通货膨胀不断改变工资与价格，债务限制了财政选择。政府必须同时面对企业、工会和各省的要求，并为经济调整争取足够的支持。"
