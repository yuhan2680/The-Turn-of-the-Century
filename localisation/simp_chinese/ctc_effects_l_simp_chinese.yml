 CTC_EFFECT_ctc_china_outcome_1_a:0 "完成“稳定至上”，获得“六月之后”；改革派影响降至10，保守派影响升至85，沟通信任降至10。"
 CTC_EFFECT_ctc_china_outcome_2_a:0 "完成“民主万岁”，赵紫阳领导改革政府，开放选举；以“改革协议”替换“治理整顿”。改革派影响变为80，保守派影响变为25。"
 CTC_EFFECT_ctc_china_outcome_3_a:0 "完成“工人平等”，劳动协商委员会主持工作；以“劳动协约”替换“治理整顿”。"
 CTC_EFFECT_ctc_china_outcome_4_a:0 "完成“二次革命”，继续控制革命一方。旧政府保留96%的原有陆军、全部海军和98%的空军。革命方动员48个四营民兵师，初始人员80%、装备55%，仅有少数正规部队响应。战后纲领须在取胜后决定。"
 CTC_EFFECT_ctc_china_outcome_5_a:0 "完成“工学联合”，开放选举。工学联合政府：稳定度+10%、科研速度+12%、军工产出+15%、生活消费品系数−5%、政治点获取+10%。另获三年“重建总动员”：建设速度+30%、工厂维修速度+75%、陆军组织度+10%、补给消耗−15%；政治点+150、陆军经验+75，仅发放一次。"
 CTC_EFFECT_ctc_china_outcome_5_b:0 "完成“继续革命”。继续革命：军工产出+25%、船坞产出+10%、生产效率增长+20%、陆军组织度+15%、适役人口+1%、生活消费品系数−4%。另获三年“重建总动员”：建设速度+30%、工厂维修速度+75%、陆军组织度+10%、补给消耗−15%；政治点+150、陆军经验+75，仅发放一次。"
