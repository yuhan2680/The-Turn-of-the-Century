l_simp_chinese:
 ctc_prc_governance_adjustment:0 "治理整顿"
 ctc_prc_governance_adjustment_desc:0 "一九八八年秋，中央决定压缩过热的投资，整顿经济秩序。地方项目需要重新审查，信贷收紧也使部分企业周转困难。控制物价与维持生产，成为各级政府必须同时面对的两件事。"
 ctc_prc_dual_prices:0 "价格双轨制"
 ctc_prc_dual_prices_desc:0 "计划内物资仍按规定价格分配，计划外部分则由市场定价。同一种商品的两套价格给企业留下了经营空间，也使批条、关系和转手倒卖有利可图。"
 ctc_prc_army_reorganization:0 "整编之后"
 ctc_prc_army_reorganization_desc:0 "百万裁军已经完成，陆军部队开始按集团军体制编组。员额减少了，合成训练、军官教育和装备更新仍要逐项推进；仅靠改换编制，不能补齐现代作战的条件。"
 ctc_prc_supply_guarantees:0 "保供措施"
 ctc_prc_supply_guarantees_desc:0 "运输和供应部门开始逐项处理粮食、副食品与生活必需品的调拨。货物能否按时到站、进入商店，直接影响居民对整顿措施的承受能力。"
 ctc_prc_june_aftermath:0 "六月之后"
 ctc_prc_june_aftermath_desc:0 "街头的运动被武力终止，清查和追捕接踵而来。中央重新控制了政治局面，但伤亡、沉默与失去的信任，将长久留在社会生活中。"
 ctc_prc_reform_agreement:0 "改革协议"
 ctc_prc_reform_agreement_desc:0 "公开监督与政治参与的安排已写入协议。旧有机关必须按新的程序办事，报刊、学生与地方代表也将逐项追问承诺如何落实。"
 ctc_prc_labour_compact:0 "劳动协约"
 ctc_prc_labour_compact_desc:0 "工人代表争得了组织、协商工资与监督企业的权利。复工不再意味着撤销组织；今后的分配与劳动保障，需要在保留下来的谈判机构中解决。"
 ctc_prc_general_strike:0 "工厂停工"
 ctc_prc_general_strike_desc:0 "工人以停工要求落实组织和协商权利。生产受到影响，维持生活必需品和公共服务则由各单位分别协调。复工的条件，仍在代表与政府之间讨论。"
 ctc_prc_revolutionary_coalition:0 "革命联合阵线"
 ctc_prc_revolutionary_coalition_desc:0 "少数响应部队带来了军官与武器，更多加入者刚刚离开车间和校园。多数民兵还没有领齐枪支，联合指挥部也无法立即把各地的纠察队变成正规军。旧政府仍掌握绝大部分军队和重装备。"
 ctc_prc_reconstruction_mobilization:0 "重建总动员"
 ctc_prc_reconstruction_mobilization_desc:0 "停火以后，工兵与地方施工队一道抢修铁路、电站和厂房。军队移交征用的仓库，工会登记返乡人员，大学重新开课。战时积累的组织经验，开始用在恢复生产和生活上。"
 ctc_prc_social_democratic_settlement:0 "工学联合政府"
 ctc_prc_social_democratic_settlement_desc:0 "推选出的代表进入议会，独立工会保留组织权，大学恢复教学与研究。战时联盟把土地、厂房与公共预算的处置交给成文程序；共同争取的制度，也要能容纳今后的反对意见。"
 ctc_prc_maoist_settlement:0 "继续革命"
 ctc_prc_maoist_settlement_desc:0 "地方代表和生产单位组织参与重建，军队开办干部学校，工厂集中力量恢复设备与军需生产。革命委员会把战时的动员网络延伸到基层，要求干部接受群众监督。"
