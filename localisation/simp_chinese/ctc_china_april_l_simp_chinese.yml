l_simp_chinese:
 ctc_china_april.2.t:0 "校园里的悼念"
 ctc_china_april.2.desc:0 "宿舍楼前贴出了挽联和大字报。有人回忆胡耀邦，也有人写下物价、干部作风和政治改革的问题。纸张不断添上去，围观和抄录的人越来越多。\n\n学校向上级询问：这些讨论能否继续，收到的意见又该送到哪里？"
 ctc_china_april.2.a:0 "允许讨论，由学校汇总意见。"
 ctc_china_april.2.b:0 "限于悼念事项，撤下政治性大字报。"
 ctc_china_april.4.t:0 "关于胡耀邦的评价"
 ctc_china_april.4.desc:0 "请愿材料要求重新评价胡耀邦，尤其是他在一九八七年辞职前后受到的批评。讣告中的褒扬没有回答这个问题。\n\n若同意复查，组织部门就必须调取材料，听取当事人的陈述；如果维持原有结论，也须把这一决定明确告诉递交请愿的人。"
 ctc_china_april.4.a:0 "启动复查，公布受理办法。"
 ctc_china_april.4.a_note:0 "登记复查承诺；五月仍须处理首期答复与执行。"
 ctc_china_april.4.b:0 "维持现有评价，暂不复议。"
 ctc_china_april.5.t:0 "旧案申诉"
 ctc_china_april.5.desc:0 "重新评价胡耀邦的要求，把一些旧案也带到了案头。申诉者希望复查此前政治运动中的处分，有的关系到工作，有的关系到已经失去多年的学业。\n\n开放受理，需要有人逐份查卷、询问和答复。仅仅收下一叠材料，并不能让处分自行撤销。"
 ctc_china_april.5.a:0 "开放申诉，逐案复查。"
 ctc_china_april.5.b:0 "不重新受理已经作出结论的案件。"
 ctc_china_april.6.t:0 "干部的账目"
 ctc_china_april.6.desc:0 "请愿书提出公开干部及家属的收入与财产。批条、经商和物资倒卖的议论已经传开，内部检查能查到什么，公众又能看见什么，是两回事。\n\n有关部门送来了两种办法：一份拟定公开申报试点，另一份仍按内部审查程序办理。"
 ctc_china_april.6.a:0 "提出公开申报试点。"
 ctc_china_april.6.a_note:0 "公开申报进入后续改革协议的监督议程。"
 ctc_china_april.6.b:0 "进行内部核查。"
 ctc_china_april.6.c:0 "暂缓决定，先核实可执行的办法。"
 ctc_china_april.7.t:0 "报纸由谁来办"
 ctc_china_april.7.desc:0 "材料中有开放报禁、允许民间办报和制定新闻法的要求。报社编辑关心能否自行判断新闻，主管部门担心既有审批制度被绕开。\n\n眼前的报道可以放宽，办报制度也可以另行讨论。两种答复会给此后的记者和编辑带来不同的余地。"
 ctc_china_april.7.a:0 "启动新闻制度的公开讨论。"
 ctc_china_april.7.b:0 "先扩大现有媒体的报道范围。"
 ctc_china_april.7.c:0 "维持既有审批制度。"
 ctc_china_april.8.t:0 "教室与工资单"
 ctc_china_april.8.desc:0 "改善教育条件和知识分子待遇，也是请愿书中的要求。学校列出了设备、宿舍和教师工资方面的困难，教育部门需要一份可以执行的答复。\n\n追加专项支出，要调整现有安排；留到下一年度，则应当说明何时审议，不能把一句承诺当成已经拨款。"
 ctc_china_april.8.a:0 "调整现有安排，落实专项拨款。"
 ctc_china_april.8.a_note:0 "记录为本年度已落实拨款；下一年度审议不算本年度履约。"
 ctc_china_april.8.b:0 "列入下一年度预算审议。"
 ctc_china_april.8.b_note:0 "仅登记审议安排，不视为本年度拨款已完成。"
 ctc_china_april.8.c:0 "不作新增支出的承诺。"
 ctc_china_april.9.t:0 "集会的规则"
 ctc_china_april.9.desc:0 "游行申请、行进路线与现场联络，正在学校和公安部门之间来回传递。学生希望能够公开表达，执勤部门则要求预先知道由谁负责。\n\n双方是否可以商定临时办法，还是继续依照现有规定处理，必须在下一次人群走上街头之前说明。"
 ctc_china_april.9.a:0 "协商临时规则，并审议现有规定。"
 ctc_china_april.9.b:0 "维持现有规定。"
 ctc_china_april.10.t:0 "报道眼前发生的事"
 ctc_china_april.10.desc:0 "新闻制度的讨论尚未结束，今天的报纸却要付印。记者已在校园和街头采访，稿件中既有诉求，也有政府部门的答复。\n\n编辑部需要明确的指示：这些材料能否核实后刊登，还是只能采用统一审定的通报？"
 ctc_china_april.10.a:0 "核实后刊登诉求与各方回应。"
 ctc_china_april.10.b:0 "只采用审定通报。"
 ctc_china_april.11.t:0 "新华门前"
 ctc_china_april.11.desc:0 "请愿者在新华门外聚集，希望有领导人接见。执勤人员守住入口，外围仍有人不断靠近。现场传回的报告，催促中央给出明确指示。\n\n一位有权答复的接洽人、一个只能转交材料的窗口，或一道要求人群离开的命令，会把这一夜带向不同的方向。"
 ctc_china_april.11.a:0 "派有授权的代表接收请愿。"
 ctc_china_april.11.b:0 "保留接访窗口，继续劝离。"
 ctc_china_april.11.b_note:0 "现场仍可能出现冲突指控，须核查伤情和处置经过。"
 ctc_china_april.11.c:0 "要求结束聚集，命令执勤人员驱离。"
 ctc_china_april.12.t:0 "伤情报告"
 ctc_china_april.12.desc:0 "新华门外的处置引起了争议。学生送来伤情和现场经过的陈述，执勤部门也提交了自己的报告。校园中流传的说法，有的可以核实，有的仍只是转述。\n\n应当调取现场记录和医院材料，再决定怎样说明情况。调查的范围与公开程度，同样会影响人们是否相信结论。"
 ctc_china_april.12.a:0 "核查材料，公开调查程序。"
 ctc_china_april.12.b:0 "只作内部调查。"
 ctc_china_april.12.c:0 "不另行调查，维持原有通报。"
 ctc_china_april.13.t:0 "罢课的教室"
 ctc_china_april.13.desc:0 "一些教室空了下来，学生在校园里讨论是否继续罢课、怎样组织悼念和请愿。院系教师开始在学生与校方之间传递意见。\n\n课程和考试需要安排，食堂、宿舍和校医院也要继续工作。学校要求知道，复课应靠协商还是处分来推动。"
 ctc_china_april.13.a:0 "允许学校协商复课与补课安排。"
 ctc_china_april.13.b:0 "以纪律处分督促复课。"
 ctc_china_april.13.c:0 "维持校园服务，暂缓处置。"
 ctc_china_april.14.t:0 "知识界的公开信"
 ctc_china_april.14.desc:0 "学者和作家陆续联署，要求认真回应学生，避免对立继续扩大。他们的看法并不完全一致，却都试图在政府与校园之间找到说话的位置。\n\n公开信已送达有关机关。签署者可以成为联络人和见证者，也可能只收到一份书面回函。"
 ctc_china_april.14.a:0 "邀请签署者参与联络和见证。"
 ctc_china_april.14.b:0 "书面回应，不另设协商席位。"
 ctc_china_april.14.c:0 "限制传播，批评这次联署。"
 ctc_china_april.16.t:0 "地方传来的报告"
 ctc_china_april.16.desc:0 "北京之外也出现了悼念和示威。西安、长沙的报告提到局部冲突和破坏行为，其他材料则记载了和平集会。几种性质不同的情况，被放在同一批文件里送到了中央。\n\n如何使用这些材料，会影响对全国局势的判断。地方公安需要处理具体案件，政治决策也需要知道报告中有哪些事实仍未核实。"
 ctc_china_april.16.a:0 "逐案核实，区分集会与具体违法行为。"
 ctc_china_april.16.b:0 "据此判断运动整体已在升级。"
 ctc_china_april.16.c:0 "要求补充材料，暂缓结论。"
 ctc_china_april.17.t:0 "学生的自治联合"
 ctc_china_april.17.desc:0 "各校学生开始建立跨校的自治联合组织，试图协调游行和对话。代表的产生、授权和任期仍在争论中，官方学生组织已经不能代表所有参与者。\n\n政府不能替学生选出代表，但必须决定愿意同谁接洽，以及怎样核实对方得到的授权。"
 ctc_china_april.17.a:0 "接洽自治组织推选的代表。"
 ctc_china_april.17.b:0 "只认可官方学生组织。"
 ctc_china_april.17.c:0 "先核实各校授权，不预先定性。"
 ctc_china_april.19.t:0 "北京市委的报告"
 ctc_china_april.19.desc:0 "北京市委向中央报告局势，着重列举了组织活动和秩序方面的问题。学校、医院与接访部门掌握的材料，却未必都在这一份报告里。\n\n中央怎样听取情况，将决定下一次会议讨论的基础。不同来源需要互相核对，也需要区分观察到的事实与报告者的判断。"
 ctc_china_april.19.a:0 "同时听取学校、医院和社会代表的报告。"
 ctc_china_april.19.b:0 "主要依据市委的处置报告。"
 ctc_china_april.19.c:0 "先作交叉核验。"
 ctc_china_april.20.t:0 "中央的定性"
 ctc_china_april.20.desc:0 "局势报告已经送到中央。要求恢复秩序的人，主张把运动看作一场针对现有政治制度的挑战；主张协商的人则要求把具体诉求、学生行动与少数冲突分别处理。\n\n这一判断将成为宣传和行政部门执行的依据。社论尚未见报，内部意见还有最后一次明确的机会。"
 ctc_china_april.20.a:0 "把社会诉求与秩序问题分别处理。"
 ctc_china_april.20.b:0 "接受全面政治对抗的定性。"
 ctc_china_april.20.c:0 "保留意见，继续观察。"
 ctc_china_april.23.t:0 "《世界经济导报》"
 ctc_china_april.23.desc:0 "上海围绕《世界经济导报》悼念胡耀邦的报道发生了争执。有关部门要求调整版面、整顿报社，并提出处理总编辑钦本立。编辑部则坚持原有报道。\n\n中央需要回应这场争议。支持编辑部、认可整顿，或重新审查处理程序，都将被其他报社看在眼里。"
 ctc_china_april.23.a:0 "支持原编辑团队继续工作。"
 ctc_china_april.23.b:0 "维持整顿与人事处理。"
 ctc_china_april.23.c:0 "暂停进一步处置，复核程序。"
 ctc_china_april.24.t:0 "记者带回的稿件"
 ctc_china_april.24.desc:0 "《科技日报》等报社的记者继续在校园和街头采访。稿件中的见闻、受访者的说法与统一通报并不总是一致，编辑部开始追问哪些内容可以刊登。\n\n新闻改革尚未落定，眼前这批经过核实的材料却不能一直压在抽屉里。"
 ctc_china_april.24.a:0 "核实事实后，允许刊发现场报道。"
 ctc_china_april.24.b:0 "要求统一报道口径。"
 ctc_china_april.26.t:0 "会面之后"
 ctc_china_april.26.desc:0 "会面已经结束，政府通报与学生带回校园的说法却有出入。有些参与者认为答复已经给出，另一些人只听到了继续讨论的承诺。\n\n会谈记录由谁确认、争议怎样公开，将影响下一次坐到桌前的人是否仍得到各自的信任。"
 ctc_china_april.26.a:0 "公布经双方确认的会议记录。"
 ctc_china_april.26.b:0 "只发布政府总结。"
 ctc_china_april.26.c:0 "允许双方分别公布自己的意见。"
 ctc_china_april.27.t:0 "中央协调分工"
 ctc_china_april.27.desc:0 "[CTCAprilReturnContext]\n\n此前的接洽、社论和处置命令，现在都需要有人继续负责。总书记保留职务，并不自动意味着他仍有权代表中央谈判。新的分工应当说明谁能作出承诺，谁负责让承诺得到执行。"
 ctc_china_april.27.a:0 "重申赵紫阳统筹协商的职责。"
 ctc_china_april.27.b:0 "保留职务，将危机处置交给其他人。"
 ctc_china_april.27.c:0 "设立临时集体协调安排。"
 ctc_china_april.28.t:0 "是否修正定性"
 ctc_china_april.28.desc:0 "强硬社论的措辞仍是对话中绕不开的问题。停止重复它，并不能让已经发表的定性自动失效；公开修正，则需要面对党内和宣传系统的阻力。\n\n与学生继续接洽以前，中央必须说明，报纸上那份判断是否仍然代表现行方针。"
 ctc_china_april.28.a:0 "正式修正社论对运动的定性。"
 ctc_china_april.28.a_note:0 "保留社论和游行曾经发生的记录；此后按已修正定性处理。"
 ctc_china_april.28.b:0 "保留原文，停止继续强化。"
 ctc_china_april.28.c:0 "再次强调原有定性。"
 ctc_china_april.29.t:0 "重新安排的会面"
 ctc_china_april.29.desc:0 "延期后的会面终于有了安排。学生代表要求知道这次能谈到哪些事项，政府工作人员也需要一份可以继续执行的议程。\n\n日期可以改变，代表资格与答复是否有效的问题仍须正面处理。"
 ctc_china_april.29.a:0 "确认代表与议程，举行会面。"
 ctc_china_april.30.t:0 "仍在等待的请愿"
 ctc_china_april.30.desc:0 "请愿材料已经收下，几天过去，各部门却还没有给出答复。递交材料的人再次追问，哪些问题能够讨论，何时可以得到明确回应。\n\n现在可以开始分项处理，也可以说明暂不受理的范围。继续只发一张收条，已经难以维持信任。"
 ctc_china_april.30.a:0 "开始分项答复。"
 ctc_china_april.30.b:0 "说明暂不受理的范围。"
 CTC_APRIL_ZHAO_RETURNED:0 "赵紫阳结束访朝行程回到北京。离京期间作出的决定和仍未解决的争论，都已摆在他面前。"
 CTC_APRIL_ZHAO_STAYED:0 "访朝行程已经推迟，赵紫阳仍在北京协调。留京没有消除中央内部的分歧，处置权限仍须重新说清。"
