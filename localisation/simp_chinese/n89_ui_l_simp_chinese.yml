 n89_handover.1.t:0 "香港回归"
 n89_handover.1.d:0 "七月一日零时，中英两国完成香港政权交接。中华人民共和国香港特别行政区成立，新的行政机构开始履行职务。香港进入了一国两制之下的新阶段。"
 n89_handover.1.a:0 "办理交接，维持各项公共服务。"
 n89_handover.2.t:0 "澳门回归"
 n89_handover.2.d:0 "十二月二十日零时，中葡两国完成澳门政权交接。中华人民共和国澳门特别行政区成立。交接仪式结束后，新的行政机构开始接手日常工作。"
 n89_handover.2.a:0 "办理交接，维持各项公共服务。"
